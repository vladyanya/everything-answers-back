<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Warm surface — Vladislav Chumachenko</title>
<style>
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; color:#f2f3f6;
    background:radial-gradient(120% 80% at 50% -10%, #14161d 0%, #050506 60%) fixed, #050506;
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif; -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center; padding:28px; -webkit-tap-highlight-color:transparent; }

  .back{ position:fixed; left:20px; top:18px; z-index:9; display:inline-flex; align-items:center; gap:7px;
    padding:8px 13px 8px 11px; border-radius:999px; text-decoration:none;
    background:rgba(255,255,255,.08); color:#eaf2f6; border:1px solid rgba(255,255,255,.10);
    font:600 12.5px/1 -apple-system,Inter,sans-serif; backdrop-filter:blur(10px);
    transition:background .18s, transform .18s; }
  .back:hover{ background:rgba(255,255,255,.16); transform:translateX(-2px); }

  .screen{ position:relative; width:min(440px,100%); aspect-ratio:3/4; border-radius:34px; overflow:hidden;
    background:#0a0b16; isolation:isolate; box-shadow:0 40px 90px rgba(0,0,0,.6), 0 4px 0 rgba(255,255,255,.05) inset; }
  .screen canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; cursor:crosshair; touch-action:none; }

  .frame{ position:absolute; inset:0; pointer-events:none; border-radius:inherit;
    box-shadow: inset 0 0 70px 22px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.28), inset 0 0 0 1px rgba(255,255,255,.07); }
  .topscrim{ position:absolute; inset:0; pointer-events:none; border-radius:inherit;
    background:linear-gradient(180deg, rgba(4,6,20,.5) 0%, rgba(4,6,20,0) 30%),
               linear-gradient(0deg, rgba(4,6,20,.45) 0%, rgba(4,6,20,0) 34%); }

  .head{ position:absolute; left:20px; right:20px; top:18px; z-index:2; pointer-events:none; text-shadow:0 1px 12px rgba(0,0,24,.5); }
  .head .k{ font:600 11px/1 ui-monospace,Menlo,monospace; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.5); }
  .head .n{ margin-top:6px; font-size:24px; font-weight:700; letter-spacing:-.02em; color:#fff; }

  .hint{ position:absolute; left:0; right:0; top:44%; z-index:2; text-align:center; pointer-events:none;
    font:600 13px/1.4 -apple-system,Inter,sans-serif; color:rgba(255,255,255,.9); text-shadow:0 1px 12px rgba(0,0,24,.6);
    transition:opacity .6s; }

  .bar{ position:absolute; left:14px; right:14px; bottom:14px; z-index:3;
    display:flex; align-items:center; gap:12px; padding:11px 11px 11px 16px;
    background:rgba(12,12,24,.42); border:1px solid rgba(255,255,255,.10); border-radius:20px;
    backdrop-filter:blur(16px) saturate(1.2); box-shadow:0 8px 30px rgba(0,0,0,.35); }
  .bar .lab{ font:600 11px/1.1 -apple-system,Inter,sans-serif; color:rgba(255,255,255,.85); width:34px; flex:none; letter-spacing:.02em; }
  .rng{ -webkit-appearance:none; appearance:none; flex:1; height:6px; border-radius:999px; outline:none;
    background:linear-gradient(90deg,#3a6bff,#12c2c2,#3ecf6b,#ffd23e,#ff7a29); }
  .rng::-webkit-slider-thumb{ -webkit-appearance:none; width:20px; height:20px; border-radius:50%; cursor:pointer; background:#fff; box-shadow:0 2px 8px rgba(0,0,0,.4); }
  .rng::-moz-range-thumb{ width:20px; height:20px; border:none; border-radius:50%; background:#fff; cursor:pointer; }
  .val{ font:11px/1 ui-monospace,Menlo,monospace; color:#ffc98f; width:32px; text-align:right; flex:none; }
  .fab{ width:44px; height:44px; flex:none; border:none; border-radius:50%; cursor:pointer; background:#fff; color:#0a0b16;
    display:flex; align-items:center; justify-content:center; box-shadow:0 6px 18px rgba(0,0,0,.4); transition:transform .12s; }
  .fab:hover{ transform:translateY(-2px); } .fab:active{ transform:translateY(0) scale(.94); }

  .err{ position:absolute; left:14px; right:14px; bottom:74px; z-index:4; display:none;
    background:#2a1418; border:1px solid #ff6b6b; color:#ffb3b3; border-radius:12px; padding:12px 14px;
    font:12px ui-monospace,Menlo,monospace; white-space:pre-wrap; }

  @media (max-width:520px){
    body{ padding:0; align-items:stretch; }
    .screen{ width:100%; height:100%; border-radius:0; aspect-ratio:auto; }
    .back{ background:rgba(255,255,255,.14); }
    .rng{ height:8px; }                              /* крупнее touch-таргет на мобилке */
    .rng::-webkit-slider-thumb{ width:26px; height:26px; }
    .rng::-moz-range-thumb{ width:26px; height:26px; }
  }
  @keyframes pageFade{ from{ opacity:0; } to{ opacity:1; } }
  @media (prefers-reduced-motion: no-preference){
    body{ animation:pageFade .3s ease both; }
    body.leaving{ opacity:0; transition:opacity .17s ease; animation:none; }
  }
</style>
</head>
<body>
<a class="back" href="./index.html">← back</a>
<div class="screen">
  <canvas id="c"></canvas>
  <div class="frame"></div>
  <div class="topscrim"></div>
  <div class="bar">
    <span class="lab">Flow</span>
    <input class="rng" id="flow" type="range" min="0" max="1" step="0.01" value="0.5">
    <span class="val" id="flowVal">50%</span>
    <button class="fab" id="cool" aria-label="Cool down" title="Cool down">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 2v20M2 12h20M4.9 4.9l14.2 14.2M19.1 4.9L4.9 19.1"/>
      </svg>
    </button>
  </div>
  <div class="err" id="err"></div>
</div>
<script>
/* Warm surface — тепловая карта, отвечающая на касание.
   Ping-pong поле тепла: касание впрыскивает тепло → диффузия → медленное остывание.
   База — всегда живой переливающийся термоградиент (domain-warped fbm). */
(function(){
const canvas=document.getElementById('c');
const errBox=document.getElementById('err');
const gl=canvas.getContext('webgl2',{antialias:false,alpha:false,powerPreference:'high-performance'});
function fail(m){ errBox.style.display='block'; errBox.textContent=m; }
if(!gl){ fail('WebGL2 is not supported by this browser.'); return; }

// float-таргеты для гладкой диффузии; иначе RGBA8 (тепло всё равно живёт в 0..1)
let stateInternal, stateType;
{ const eF=gl.getExtension('EXT_color_buffer_float'), eH=gl.getExtension('EXT_color_buffer_half_float');
  if(eF||eH){ stateInternal=gl.RGBA16F; stateType=gl.HALF_FLOAT; } else { stateInternal=gl.RGBA8; stateType=gl.UNSIGNED_BYTE; }
  gl.getExtension('OES_texture_float_linear'); }

gl.bindVertexArray(gl.createVertexArray());
{ const b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0); }

const VERT='#version 300 es\nin vec2 a_position; void main(){ gl_Position=vec4(a_position,0.,1.); }';
const HEAD='#version 300 es\nprecision highp float;\nuniform vec2 u_res;\nout vec4 fragColor;\nvec2 uv0(){ return gl_FragCoord.xy/u_res; }\n';

/* --- симуляция тепла (диффузия + остывание + впрыск от касания) --- */
const SIM = `
uniform sampler2D u_prev;
uniform vec2  u_p;        // курсор 0..1
uniform vec2  u_pPrev;    // курсор в прошлом кадре
uniform float u_inject;   // впрыск тепла при касании
uniform float u_tap;      // разовый всплеск (тап)
uniform float u_diff;     // скорость диффузии
uniform float u_decay;    // остывание за шаг
uniform float u_cool;     // разовое общее охлаждение (кнопка)

float Hh(vec2 uv){ return texture(u_prev, uv).r; }
float segDist(vec2 p, vec2 a, vec2 b){
  vec2 pa=p-a, ba=b-a; float t=clamp(dot(pa,ba)/max(dot(ba,ba),1e-6),0.,1.);
  return length(pa - ba*t);
}
void main(){
  vec2 uv=uv0(); vec2 texel=1./u_res; float asp=u_res.x/u_res.y;
  float h=Hh(uv);
  float l=Hh(uv-vec2(texel.x,0.)), r=Hh(uv+vec2(texel.x,0.));
  float u=Hh(uv+vec2(0.,texel.y)), d=Hh(uv-vec2(0.,texel.y));
  float nh = h + u_diff*(l+r+u+d-4.0*h);     // диффузия тепла

  vec2 P=uv*vec2(asp,1.), A=u_pPrev*vec2(asp,1.), B=u_p*vec2(asp,1.);
  nh += u_inject * smoothstep(0.055, 0.0, segDist(P,A,B));   // тёплый след под пальцем
  nh += u_tap    * smoothstep(0.10,  0.0, length((uv-u_p)*vec2(asp,1.)));

  nh *= u_decay;                              // медленно остывает
  nh *= (1.0 - u_cool);                       // кнопка «cool down»
  nh = clamp(nh, 0.0, 1.0);
  fragColor = vec4(nh, 0.0, 0.0, 1.0);
}`;

/* --- рендер: живой термоградиент + горячие пятна касания --- */
const RENDER = `
uniform sampler2D u_state;
uniform float u_time;
uniform float u_flow;

float hash(vec2 p){ p=fract(p*vec2(127.1,311.7)); p+=dot(p,p+34.5); return fract(p.x*p.y); }
float noise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);
  float a=hash(i),b=hash(i+vec2(1,0)),c=hash(i+vec2(0,1)),d=hash(i+vec2(1,1));
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y); }
float fbm(vec2 p){ float s=0.,a=.5; for(int i=0;i<5;i++){ s+=a*noise(p); p*=2.02; a*=.5; } return s; }
// крупные мягкие ленты: доминирует низкая частота → живописно, без мелкой «мути»
float bands(vec2 p){ return 0.66*noise(p) + 0.24*noise(p*2.03+7.0) + 0.10*noise(p*4.10+19.0); }

// переливающийся термо-палитра: индиго → синий → бирюза → зелёный → жёлтый → оранж → бело-горячий
vec3 pal(float t){
  t=clamp(t,0.,1.);
  vec3 c0=vec3(0.05,0.03,0.18), c1=vec3(0.10,0.22,0.82), c2=vec3(0.05,0.64,0.82),
       c3=vec3(0.28,0.82,0.44), c4=vec3(0.98,0.88,0.26), c5=vec3(1.00,0.50,0.14), c6=vec3(1.00,0.80,0.64);
  vec3 c=c0;
  c=mix(c,c1,smoothstep(0.00,0.18,t));
  c=mix(c,c2,smoothstep(0.18,0.36,t));
  c=mix(c,c3,smoothstep(0.36,0.52,t));
  c=mix(c,c4,smoothstep(0.52,0.66,t));
  c=mix(c,c5,smoothstep(0.66,0.82,t));
  c=mix(c,c6,smoothstep(0.82,1.00,t));
  return c;
}
void main(){
  vec2 uv=uv0(); float asp=u_res.x/u_res.y;
  vec2 p=uv; p.x*=asp;
  float t=u_time*u_flow;

  // крупный мягкий поток → большие ленты цвета перетекают по поверхности (живописно)
  vec2 q=p*1.25;
  q += 0.85*vec2(bands(q*0.7+vec2(0.0, t*0.5)), bands(q*0.7+vec2(5.2,-t*0.45)));
  float base=bands(q*0.85+vec2(t*0.3,0.0));
  base=clamp((base-0.52)*1.7+0.5, 0.0, 1.0);   // баланс холодного/горячего, спокойно

  float heat=texture(u_state, uv).r;          // тепло от касания
  float v=clamp(base*0.82 + heat*1.5, 0.0, 1.0);
  vec3 col=pal(v);

  // горячие пятна ярче светятся
  col += heat*heat*vec3(0.45,0.20,0.06);

  col += (hash(gl_FragCoord.xy)-0.5)/255.;     // фикс бандинга
  fragColor=vec4(col,1.0);
}`;

function compile(t,src){ const s=gl.createShader(t); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
function program(frag){ const p=gl.createProgram();
  gl.attachShader(p,compile(gl.VERTEX_SHADER,VERT)); gl.attachShader(p,compile(gl.FRAGMENT_SHADER,HEAD+'\n'+frag));
  gl.bindAttribLocation(p,0,'a_position'); gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p)); return p; }
let progSim, progRender;
try{ progSim=program(SIM); progRender=program(RENDER); }catch(e){ fail('GLSL: '+e.message); return; }

const SIM_SCALE=0.5; let A,B,sw,sh;
function mk(w,h){ const tex=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texImage2D(gl.TEXTURE_2D,0,stateInternal,w,h,0,gl.RGBA,stateType,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  const fbo=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
  gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT); return {tex,fbo}; }
function alloc(){ sw=Math.max(2,Math.round(canvas.width*SIM_SCALE)); sh=Math.max(2,Math.round(canvas.height*SIM_SCALE));
  if(A){gl.deleteTexture(A.tex);gl.deleteFramebuffer(A.fbo);} if(B){gl.deleteTexture(B.tex);gl.deleteFramebuffer(B.fbo);}
  A=mk(sw,sh); B=mk(sw,sh); gl.bindFramebuffer(gl.FRAMEBUFFER,null); }
function resize(){ const dpr=Math.min(window.devicePixelRatio||1,2);
  const w=Math.max(1,Math.round(canvas.clientWidth*dpr)), h=Math.max(1,Math.round(canvas.clientHeight*dpr));
  if(canvas.width!==w||canvas.height!==h){ canvas.width=w; canvas.height=h; alloc(); } }
new ResizeObserver(resize).observe(canvas);

const ptr={x:0.5,y:0.5,px:0.5,py:0.5,inside:false};
let touched=false;
const hintEl=document.getElementById('hint');
function markTouched(){ if(!touched){ touched=true; if(hintEl) hintEl.style.opacity='0'; } }
canvas.addEventListener('pointermove',e=>{ const r=canvas.getBoundingClientRect();
  ptr.x=(e.clientX-r.left)/r.width; ptr.y=1-(e.clientY-r.top)/r.height; ptr.inside=true; });
canvas.addEventListener('pointerleave',()=> ptr.inside=false);
canvas.addEventListener('pointerdown',e=>{ const r=canvas.getBoundingClientRect();
  ptr.x=(e.clientX-r.left)/r.width; ptr.y=1-(e.clientY-r.top)/r.height; ptr.inside=true;
  tap.pending=true; tap.x=ptr.x; tap.y=ptr.y; markTouched(); });
const tap={pending:false,x:0.5,y:0.5};

let flow=0.5, coolPending=false;
const flowEl=document.getElementById('flow'), flowVal=document.getElementById('flowVal');
flowEl.oninput=()=>{ flow=parseFloat(flowEl.value); flowVal.textContent=Math.round(flow*100)+'%'; };
document.getElementById('cool').onclick=()=>{ coolPending=true; };

const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const L=(p,n)=>gl.getUniformLocation(p,n);
let last=performance.now();
function frame(now){
  const dt=Math.min((now-last)/1000,0.05); last=now;
  const inject=ptr.inside?0.16:0.0;
  const tapAmt=tap.pending?0.7:0.0;
  const coolAmt=coolPending?0.85:0.0;
  let read=A, write=B;
  for(let i=0;i<2;i++){
    gl.useProgram(progSim); gl.bindFramebuffer(gl.FRAMEBUFFER,write.fbo); gl.viewport(0,0,sw,sh);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,read.tex);
    gl.uniform1i(L(progSim,'u_prev'),0); gl.uniform2f(L(progSim,'u_res'),sw,sh);
    gl.uniform2f(L(progSim,'u_p'), ptr.x, ptr.y);
    gl.uniform2f(L(progSim,'u_pPrev'), ptr.px, ptr.py);
    gl.uniform1f(L(progSim,'u_inject'), inject);
    gl.uniform1f(L(progSim,'u_tap'), i===0?tapAmt:0);
    gl.uniform1f(L(progSim,'u_diff'), 0.08);
    gl.uniform1f(L(progSim,'u_decay'), 0.997);
    gl.uniform1f(L(progSim,'u_cool'), i===0?coolAmt:0);
    gl.drawArrays(gl.TRIANGLES,0,3); const t=read; read=write; write=t;
  }
  tap.pending=false; coolPending=false; ptr.px=ptr.x; ptr.py=ptr.y;

  gl.useProgram(progRender); gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.viewport(0,0,canvas.width,canvas.height);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,read.tex);
  gl.uniform1i(L(progRender,'u_state'),0); gl.uniform2f(L(progRender,'u_res'),canvas.width,canvas.height);
  gl.uniform1f(L(progRender,'u_time'), reduceMotion?10.0:now/1000);   /* reduce: фон статичен, тепло от касания живёт */
  gl.uniform1f(L(progRender,'u_flow'), 0.05 + flow*0.45);
  gl.drawArrays(gl.TRIANGLES,0,3);
  requestAnimationFrame(frame);
}
resize(); requestAnimationFrame(frame);
})();
</script>
<script>
(function(){ var q=new URLSearchParams(location.search);
  if(q.has('embed')){ var e=document.querySelector('.back'); if(e)e.remove(); }
  var b=document.querySelector('.back');
  if(b && !matchMedia('(prefers-reduced-motion: reduce)').matches){ b.addEventListener('click',function(ev){ ev.preventDefault(); document.body.classList.add('leaving'); setTimeout(function(){ location.href=b.getAttribute('href'); },175); }); }
})();
</script>
</body>
</html>
