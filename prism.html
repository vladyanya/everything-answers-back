<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Prism — Vladislav Chumachenko</title>
<style>
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; color:#f2f3f6;
    background:radial-gradient(120% 80% at 50% -10%, #14161d 0%, #050506 60%) fixed, #050506;
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif; -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center; padding:28px; -webkit-tap-highlight-color:transparent; }

  .back{ position:fixed; left:20px; top:18px; z-index:9; display:inline-flex; align-items:center; gap:7px;
    padding:8px 13px 8px 11px; border-radius:999px; text-decoration:none;
    background:rgba(255,255,255,.08); color:#eaf2f6; border:1px solid rgba(255,255,255,.10);
    font:600 12.5px/1 -apple-system,Inter,sans-serif; backdrop-filter:blur(10px);
    transition:background .18s, transform .18s; }
  .back:hover{ background:rgba(255,255,255,.16); transform:translateX(-2px); }

  .screen{ position:relative; width:min(440px,100%); aspect-ratio:3/4; border-radius:34px; overflow:hidden;
    background:#07070c; isolation:isolate; box-shadow:0 40px 90px rgba(0,0,0,.6), 0 4px 0 rgba(255,255,255,.05) inset; }
  .screen canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; cursor:crosshair; touch-action:none; }

  .frame{ position:absolute; inset:0; pointer-events:none; border-radius:inherit;
    box-shadow: inset 0 0 70px 22px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.28), inset 0 0 0 1px rgba(255,255,255,.07); }
  .topscrim{ position:absolute; inset:0; pointer-events:none; border-radius:inherit;
    background:linear-gradient(180deg, rgba(4,6,20,.5) 0%, rgba(4,6,20,0) 30%),
               linear-gradient(0deg, rgba(4,6,20,.45) 0%, rgba(4,6,20,0) 34%); }

  .head{ position:absolute; left:20px; right:20px; top:18px; z-index:2; pointer-events:none; text-shadow:0 1px 12px rgba(0,0,24,.5); }
  .head .k{ font:600 11px/1 ui-monospace,Menlo,monospace; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.5); }
  .head .n{ margin-top:6px; font-size:24px; font-weight:700; letter-spacing:-.02em; color:#fff; }

  .hint{ position:absolute; left:0; right:0; top:44%; z-index:2; text-align:center; pointer-events:none;
    font:600 13px/1.4 -apple-system,Inter,sans-serif; color:rgba(255,255,255,.9); text-shadow:0 1px 12px rgba(0,0,24,.6);
    transition:opacity .6s; }

  .bar{ position:absolute; left:14px; right:14px; bottom:14px; z-index:3;
    display:flex; align-items:center; gap:12px; padding:11px 11px 11px 16px;
    background:rgba(12,12,24,.42); border:1px solid rgba(255,255,255,.10); border-radius:20px;
    backdrop-filter:blur(16px) saturate(1.2); box-shadow:0 8px 30px rgba(0,0,0,.35); }
  .bar .lab{ font:600 11px/1.1 -apple-system,Inter,sans-serif; color:rgba(255,255,255,.85); width:34px; flex:none; letter-spacing:.02em; }
  .rng{ -webkit-appearance:none; appearance:none; flex:1; height:6px; border-radius:999px; outline:none;
    background:linear-gradient(90deg,#20206c,#4a4ae0,#a04ae0,#e0489a,#f4784a,#ffce6b); }
  .rng::-webkit-slider-thumb{ -webkit-appearance:none; width:20px; height:20px; border-radius:50%; cursor:pointer; background:#fff; box-shadow:0 2px 8px rgba(0,0,0,.4); }
  .rng::-moz-range-thumb{ width:20px; height:20px; border:none; border-radius:50%; background:#fff; cursor:pointer; }
  .val{ font:11px/1 ui-monospace,Menlo,monospace; color:#ffc98f; width:32px; text-align:right; flex:none; }
  .fab{ width:44px; height:44px; flex:none; border:none; border-radius:50%; cursor:pointer; background:#fff; color:#0a0b16;
    display:flex; align-items:center; justify-content:center; box-shadow:0 6px 18px rgba(0,0,0,.4); transition:transform .12s; }
  .fab:hover{ transform:translateY(-2px); } .fab:active{ transform:translateY(0) scale(.94); }

  .err{ position:absolute; left:14px; right:14px; bottom:74px; z-index:4; display:none;
    background:#2a1418; border:1px solid #ff6b6b; color:#ffb3b3; border-radius:12px; padding:12px 14px;
    font:12px ui-monospace,Menlo,monospace; white-space:pre-wrap; }

  @media (max-width:520px){
    body{ padding:0; align-items:stretch; }
    .screen{ width:100%; height:100%; border-radius:0; aspect-ratio:auto; }
    .back{ background:rgba(255,255,255,.14); }
    .rng{ height:8px; }                              /* крупнее touch-таргет на мобилке */
    .rng::-webkit-slider-thumb{ width:26px; height:26px; }
    .rng::-moz-range-thumb{ width:26px; height:26px; }
  }
  @keyframes pageFade{ from{ opacity:0; } to{ opacity:1; } }
  @media (prefers-reduced-motion: no-preference){
    body{ animation:pageFade .3s ease both; }
    body.leaving{ opacity:0; transition:opacity .17s ease; animation:none; }
  }
</style>
</head>
<body>
<a class="back" href="./index.html">← back</a>
<div class="screen">
  <canvas id="c"></canvas>
  <div class="frame"></div>
  <div class="topscrim"></div>
  <div class="bar">
    <span class="lab">Flow</span>
    <input class="rng" id="flow" type="range" min="0" max="1" step="0.01" value="0.5">
    <span class="val" id="flowVal">50%</span>
    <button class="fab" id="pulse" aria-label="Send a pulse" title="Send a pulse">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/>
      </svg>
    </button>
  </div>
  <div class="err" id="err"></div>
</div>
<script>
/* Prism — скруглённый квадрат ромбиком: тепло + стеклянные панели.
   Адаптация двух идей paper-design/shaders (не копия):
   · heatmap  → скаляр «тепла» через многостоповый ramp; у нас тепло — это
     пульс, обегающий КОНТУР ромба по кругу + курсор греет + тап-волна;
     контур/свечение считаются аналитически из SDF (у них — блюр картинки).
   · color-panels → полупрозрачные панели вокруг вертикальной оси; у нас —
     своя упрощённая проекция (парallax+foreshortening), панели заперты
     ВНУТРИ ромба и подсвечиваются на ребре.
   Цвет: sRGB→linear (c*c) до лайтинга, гамма на выходе; премульт-композитинг. */
(function(){
const canvas=document.getElementById('c');
const errBox=document.getElementById('err');
const gl=canvas.getContext('webgl2',{antialias:false,alpha:false,powerPreference:'high-performance'});
function fail(m){ errBox.style.display='block'; errBox.textContent=m; }
if(!gl){ fail('WebGL2 is not supported by this browser.'); return; }

gl.bindVertexArray(gl.createVertexArray());
{ const b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0); }

const VERT='#version 300 es\nin vec2 a_position; void main(){ gl_Position=vec4(a_position,0.,1.); }';

const FRAG=`#version 300 es
precision highp float;
uniform vec2  u_res;
uniform float u_time;
uniform float u_flow;    // скорость всего движения
uniform vec2  u_ptr;     // курсор в сценовых координатах
uniform float u_heat;    // сила нагрева от курсора (ease в JS)
uniform vec3  u_burst;   // тап-волна: x, y, возраст 0..1 (2 = нет)
out vec4 fragColor;

#define TWO_PI 6.28318530718

mat2 rot2(float a){ float s=sin(a), c=cos(a); return mat2(c,-s,s,c); }
float hash(vec2 p){ p=fract(p*vec2(127.1,311.7)); p+=dot(p,p+34.5); return fract(p.x*p.y); }
float noise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);
  float a=hash(i),b=hash(i+vec2(1,0)),c=hash(i+vec2(0,1)),d=hash(i+vec2(1,1));
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y); }

/* ramp тепла: индиго → синий → фиолет → маджента → коралл → оранж → золото
   (принцип heatmap; стопы наши, c*c = sRGB→linear) */
vec3 ramp(float t){
  t = clamp(t, 0.0, 1.0);
  vec3 c = vec3(0.03,0.02,0.12);
  c = mix(c, vec3(0.16,0.20,0.78), smoothstep(0.00,0.20,t));
  c = mix(c, vec3(0.48,0.26,0.90), smoothstep(0.20,0.38,t));
  c = mix(c, vec3(0.85,0.28,0.68), smoothstep(0.38,0.55,t));
  c = mix(c, vec3(0.95,0.38,0.36), smoothstep(0.55,0.70,t));
  c = mix(c, vec3(0.98,0.60,0.20), smoothstep(0.70,0.85,t));
  c = mix(c, vec3(1.00,0.85,0.48), smoothstep(0.85,1.00,t));
  return c*c;
}

float sdRoundSquare(vec2 p, float b, float r){
  vec2 q = abs(p) - b + r;
  return length(max(q,0.0)) + min(max(q.x,q.y),0.0) - r;
}
/* угловое расстояние с обёрткой */
float angDist(float a, float b){
  float d = mod(a - b, TWO_PI);
  return min(d, TWO_PI - d);
}

void main(){
  vec2 uv = (2.0*gl_FragCoord.xy - u_res)/min(u_res.x,u_res.y);
  float t = u_time * u_flow;

  /* ромбик: квадрат со скруглением, повёрнутый на 45° + лёгкое дыхание */
  vec2 p = rot2(0.7853982 + 0.05*sin(t*0.30)) * uv;
  float d = sdRoundSquare(p, 0.52, 0.14);

  float phi = atan(uv.y, uv.x);

  /* ── бегущий свет: белая «голова» + дисперсионный хвост ── */
  float phi0 = -t*0.85;
  float headDist = angDist(phi, phi0);
  float run = exp(-pow(headDist, 2.0)*7.0);

  /* свет физически вспухает край, где проходит */
  d -= 0.022*exp(-pow(headDist, 2.0)*6.0);

  float inside = smoothstep(0.008, -0.012, d);
  float contour = exp(-abs(d)*14.0);

  /* хвост позади головы: белый → золото → маджента → фиолет → синий, тает */
  float s = mod(phi - phi0, TWO_PI);          /* угловое расстояние позади */
  float tailLen = 2.4;
  float x = clamp(s/tailLen, 0.0, 1.0);
  float tail = exp(-s*1.25) * smoothstep(0.0, 0.30, s);   /* плавный фронт — без шва на стыке углов */
  vec3 spec = vec3(1.05,1.02,0.95);                              /* белая голова */
  spec = mix(spec, vec3(1.00,0.72,0.28), smoothstep(0.00,0.18,x));  /* золото  */
  spec = mix(spec, vec3(0.92,0.30,0.55), smoothstep(0.18,0.45,x));  /* маджента*/
  spec = mix(spec, vec3(0.55,0.30,0.95), smoothstep(0.45,0.72,x));  /* фиолет  */
  spec = mix(spec, vec3(0.20,0.30,0.95), smoothstep(0.72,1.00,x));  /* синий   */
  spec *= spec;                                                  /* sRGB→linear */

  float heat = contour*(0.30 + 0.95*run);

  /* внутренний фон — спокойный градиент от тёплого края к прохладному центру */
  float depth = clamp(-d*2.6, 0.0, 1.0);
  heat += inside * (0.34 - 0.24*depth);

  /* курсор греет контур и толщу */
  heat += u_heat * exp(-dot(uv-u_ptr, uv-u_ptr)*16.0) * (0.45 + 0.55*contour);

  /* тап — эхо самой формы: ромб-волна от точки касания оборачивается вокруг */
  if(u_burst.z < 1.5){
    float R = u_burst.z*0.55;
    float band = exp(-pow(abs(d)-R, 2.0)*180.0) * (1.0-u_burst.z);
    float angMask = 1.0;
    if(length(u_burst.xy) > 0.05){
      float burstPhi = atan(u_burst.y, u_burst.x);
      angMask = exp(-pow(angDist(phi, burstPhi), 2.0) / (0.35 + 5.0*u_burst.z));
    }
    heat += band*angMask*0.85;
  }

  heat = clamp(heat, 0.0, 1.0);

  vec3 col = ramp(heat) * mix(0.22, 1.0, max(inside, contour));

  /* дисперсионный хвост поверх контура + преломлённый отсвет внутрь */
  col += spec * tail * contour * 1.15;
  col += spec * tail * exp(-abs(d + 0.10)*16.0) * 0.22;   /* слабое эхо спектра внутри */

  /* лёгкое свечение наружу от контура */
  col += ramp(0.72 + 0.20*run)*exp(-max(d,0.0)*10.0)*(1.0-inside)*0.18*(0.4+run);
  col += spec * tail * exp(-max(d,0.0)*8.0)*(1.0-inside)*0.30;

  /* мягкий тонмап, гамма, дизер */
  col = col/(1.0 + max(col-vec3(1.0), 0.0)*0.6);
  col = pow(max(col, vec3(0.0)), vec3(1.0/2.2));
  col += (hash(gl_FragCoord.xy*1.7)-0.5)/255.0*3.0;
  fragColor = vec4(col, 1.0);
}`;

function compile(t,src){ const s=gl.createShader(t); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
let prog;
try{
  prog=gl.createProgram();
  gl.attachShader(prog,compile(gl.VERTEX_SHADER,VERT));
  gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,FRAG));
  gl.bindAttribLocation(prog,0,'a_position'); gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
}catch(e){ fail('GLSL: '+e.message); return; }
gl.useProgram(prog);

const L=n=>gl.getUniformLocation(prog,n);
function resize(){ const dpr=Math.min(window.devicePixelRatio||1,2);
  const w=Math.max(1,Math.round(canvas.clientWidth*dpr)), h=Math.max(1,Math.round(canvas.clientHeight*dpr));
  if(canvas.width!==w||canvas.height!==h){ canvas.width=w; canvas.height=h; gl.viewport(0,0,w,h); } }
new ResizeObserver(resize).observe(canvas);

/* указатель в сценовых координатах (те же, что uv в шейдере) */
const ptr={x:0,y:0,inside:false};
let touched=false; const hintEl=document.getElementById('hint');
function markTouched(){ if(!touched){ touched=true; if(hintEl) hintEl.style.opacity='0'; } }
function toScene(e){
  const r=canvas.getBoundingClientRect(), m=Math.min(r.width,r.height);
  return { x:(2*(e.clientX-r.left)-r.width)/m, y:-(2*(e.clientY-r.top)-r.height)/m };
}
canvas.addEventListener('pointermove',e=>{ const s=toScene(e); ptr.x=s.x; ptr.y=s.y; ptr.inside=true; markTouched(); });
canvas.addEventListener('pointerleave',()=> ptr.inside=false);
const burst={x:0,y:0,age:2};
canvas.addEventListener('pointerdown',e=>{ const s=toScene(e); burst.x=s.x; burst.y=s.y; burst.age=0; markTouched(); });
document.getElementById('pulse').onclick=()=>{ burst.x=0; burst.y=0; burst.age=0; markTouched(); };

let flow=0.5;
const flowEl=document.getElementById('flow'), flowVal=document.getElementById('flowVal');
flowEl.oninput=()=>{ flow=parseFloat(flowEl.value); flowVal.textContent=Math.round(flow*100)+'%'; };

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let heat=0, last=performance.now();
function frame(now){
  const dt=Math.min((now-last)/1000,0.05); last=now;
  heat += ((ptr.inside?1:0)-heat)*Math.min(1, dt*5);      /* плавный нагрев/остывание */
  if(burst.age<1.5) burst.age += dt/0.9;

  resize();
  gl.uniform2f(L('u_res'),canvas.width,canvas.height);
  gl.uniform1f(L('u_time'), reduce?7.0:now/1000);
  gl.uniform1f(L('u_flow'), 0.25+flow*1.1);
  gl.uniform2f(L('u_ptr'),ptr.x,ptr.y);
  gl.uniform1f(L('u_heat'),heat);
  gl.uniform3f(L('u_burst'),burst.x,burst.y,burst.age);
  gl.drawArrays(gl.TRIANGLES,0,3);
  requestAnimationFrame(frame);
}
resize(); requestAnimationFrame(frame);
})();
</script>
<script>
(function(){ var q=new URLSearchParams(location.search);
  if(q.has('embed')){ var e=document.querySelector('.back'); if(e)e.remove(); }
  var b=document.querySelector('.back');
  if(b && !matchMedia('(prefers-reduced-motion: reduce)').matches){ b.addEventListener('click',function(ev){ ev.preventDefault(); document.body.classList.add('leaving'); setTimeout(function(){ location.href=b.getAttribute('href'); },175); }); }
})();
</script>
</body>
</html>
