<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Lava — Vladislav Chumachenko</title>
<style>
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; color:#f2f3f6;
    background:radial-gradient(120% 80% at 50% -10%, #14161d 0%, #050506 60%) fixed, #050506;
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif; -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center; padding:28px; -webkit-tap-highlight-color:transparent; }

  .back{ position:fixed; left:20px; top:18px; z-index:9; display:inline-flex; align-items:center; gap:7px;
    padding:8px 13px 8px 11px; border-radius:999px; text-decoration:none;
    background:rgba(255,255,255,.08); color:#eaf2f6; border:1px solid rgba(255,255,255,.10);
    font:600 12.5px/1 -apple-system,Inter,sans-serif; backdrop-filter:blur(10px);
    transition:background .18s, transform .18s; }
  .back:hover{ background:rgba(255,255,255,.16); transform:translateX(-2px); }

  .screen{ position:relative; width:min(440px,100%); aspect-ratio:3/4; border-radius:34px; overflow:hidden;
    background:#0d0407; isolation:isolate; box-shadow:0 40px 90px rgba(0,0,0,.6), 0 4px 0 rgba(255,255,255,.05) inset; }
  .screen canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; cursor:crosshair; touch-action:none; }

  .frame{ position:absolute; inset:0; pointer-events:none; border-radius:inherit;
    box-shadow: inset 0 0 70px 22px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.24), inset 0 0 0 1px rgba(255,255,255,.06); }
  .topscrim{ position:absolute; inset:0; pointer-events:none; border-radius:inherit;
    background:linear-gradient(180deg, rgba(10,3,6,.5) 0%, rgba(10,3,6,0) 28%); }

  .head{ position:absolute; left:20px; right:20px; top:18px; z-index:2; pointer-events:none; text-shadow:0 1px 12px rgba(0,0,0,.6); }
  .head .k{ font:600 11px/1 ui-monospace,Menlo,monospace; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.5); }
  .head .n{ margin-top:6px; font-size:24px; font-weight:700; letter-spacing:-.02em; color:#fff; }

  .hint{ position:absolute; left:0; right:0; top:42%; z-index:2; text-align:center; pointer-events:none;
    font:600 13px/1.4 -apple-system,Inter,sans-serif; color:rgba(255,255,255,.9); text-shadow:0 1px 12px rgba(0,0,0,.7);
    transition:opacity .6s; }

  .bar{ position:absolute; left:14px; right:14px; bottom:14px; z-index:3;
    display:flex; align-items:center; gap:12px; padding:11px 11px 11px 16px;
    background:rgba(18,8,10,.46); border:1px solid rgba(255,255,255,.10); border-radius:20px;
    backdrop-filter:blur(16px) saturate(1.2); box-shadow:0 8px 30px rgba(0,0,0,.4); }
  .bar .lab{ font:600 11px/1.1 -apple-system,Inter,sans-serif; color:rgba(255,255,255,.85); width:34px; flex:none; letter-spacing:.02em; }
  .rng{ -webkit-appearance:none; appearance:none; flex:1; height:6px; border-radius:999px; outline:none;
    background:linear-gradient(90deg,#7a1a1a,#ff5a1e,#ffb020); }
  .rng::-webkit-slider-thumb{ -webkit-appearance:none; width:20px; height:20px; border-radius:50%; cursor:pointer; background:#fff; box-shadow:0 2px 8px rgba(0,0,0,.5); }
  .rng::-moz-range-thumb{ width:20px; height:20px; border:none; border-radius:50%; background:#fff; cursor:pointer; }
  .val{ font:11px/1 ui-monospace,Menlo,monospace; color:#ffb98a; width:32px; text-align:right; flex:none; }
  .fab{ width:44px; height:44px; flex:none; border:none; border-radius:50%; cursor:pointer; background:#fff; color:#1a0708;
    display:flex; align-items:center; justify-content:center; box-shadow:0 6px 18px rgba(0,0,0,.5); transition:transform .12s; }
  .fab:hover{ transform:translateY(-2px); } .fab:active{ transform:translateY(0) scale(.94); }

  .err{ position:absolute; left:14px; right:14px; bottom:74px; z-index:4; display:none;
    background:#2a1418; border:1px solid #ff6b6b; color:#ffb3b3; border-radius:12px; padding:12px 14px;
    font:12px ui-monospace,Menlo,monospace; white-space:pre-wrap; }

  @media (max-width:520px){
    body{ padding:0; align-items:stretch; }
    .screen{ width:100%; height:100%; border-radius:0; aspect-ratio:auto; }
    .back{ background:rgba(255,255,255,.14); }
    .rng{ height:8px; }                              /* крупнее touch-таргет на мобилке */
    .rng::-webkit-slider-thumb{ width:26px; height:26px; }
    .rng::-moz-range-thumb{ width:26px; height:26px; }
  }
  @keyframes pageFade{ from{ opacity:0; } to{ opacity:1; } }
  @media (prefers-reduced-motion: no-preference){
    body{ animation:pageFade .3s ease both; }
    body.leaving{ opacity:0; transition:opacity .17s ease; animation:none; }
  }
</style>
</head>
<body>
<a class="back" href="./index.html">← back</a>
<div class="screen">
  <canvas id="c"></canvas>
  <div class="frame"></div>
  <div class="topscrim"></div>
  <div class="bar">
    <span class="lab">Heat</span>
    <input class="rng" id="heat" type="range" min="0" max="1" step="0.01" value="0.45">
    <span class="val" id="heatVal">45%</span>
    <button class="fab" id="bloop" aria-label="Release a bubble" title="Release a bubble">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="9" cy="14" r="4.2"/><circle cx="16" cy="8" r="2.6"/>
      </svg>
    </button>
  </div>
  <div class="err" id="err"></div>
</div>
<script>
/* Lava — восковая лава-лампа. Метаболы медленно поднимаются/опускаются и слипаются.
   Трогаешь — под пальцем греется и вспучивается; кнопка Bloop пускает новый пузырь. */
(function(){
const canvas=document.getElementById('c');
const errBox=document.getElementById('err');
const gl=canvas.getContext('webgl2',{antialias:false,alpha:false,powerPreference:'high-performance'});
function fail(m){ errBox.style.display='block'; errBox.textContent=m; }
if(!gl){ fail('WebGL2 is not supported by this browser.'); return; }

const VERT=`#version 300 es
in vec2 a; void main(){ gl_Position=vec4(a,0.,1.); }`;

const FRAG=`#version 300 es
precision highp float;
uniform vec2  u_res;
uniform float u_time;
uniform float u_heat;
uniform vec2  u_p;
uniform float u_pIn;
uniform vec3  u_bub[6];    // x,y (uv), radius (0 = выкл)
out vec4 fragColor;
float hash(vec2 p){ return fract(sin(dot(p,vec2(41.3,289.1)))*43758.5453); }
float hash1(float n){ return fract(sin(n*127.1)*43758.5453); }
float vnoise(vec2 p){ vec2 i=floor(p),f=fract(p),u=f*f*(3.0-2.0*f);
  float a=hash(i),b=hash(i+vec2(1,0)),c=hash(i+vec2(0,1)),d=hash(i+vec2(1,1));
  return mix(mix(a,b,u.x),mix(c,d,u.x),u.y); }

void main(){
  vec2 uv=gl_FragCoord.xy/u_res; float asp=u_res.x/u_res.y;
  vec2 p=vec2(uv.x*asp, uv.y);
  float t=u_time*(0.10 + u_heat*0.35);
  // органический warp → неровные, «живые» формы вместо идеальных кругов
  vec2 wp = p + 0.085*vec2(vnoise(p*3.0+vec2(t*0.25,1.0))-0.5, vnoise(p*3.0+vec2(9.0,-t*0.25))-0.5);

  float F=0.0;
  // крупные восковые блобы — вытянутые/скошенные (teardrop), а не круги
  for(int i=0;i<6;i++){ float fi=float(i);
    float bx=(0.5 + (fi/5.0-0.5)*0.60)*asp + 0.05*asp*sin(t*0.5+fi*1.3);
    float by=0.5 + 0.42*sin(t*(0.28+0.05*fi) + fi*1.7);
    float r=0.085 + 0.03*sin(t*0.4+fi*2.0);
    float st=0.52 + 0.30*sin(t*0.5+fi*1.5);          // переменное вертикальное растяжение
    float sh=0.22*sin(t*0.35+fi);                     // сдвиг → капля наклоняется
    vec2 dv=wp-vec2(bx,by); dv.x+=dv.y*sh; dv.y*=st;
    F += r*r/(dot(dv,dv)+0.0008);
  }
  // много мелких капель — вытянутые, поднимаются и зацикливаются
  for(int i=0;i<14;i++){ float fi=float(i);
    float sx=hash1(fi*1.7+0.3)*asp;
    float spd=0.06 + hash1(fi*3.3)*0.14;
    float y=-0.06 + fract(hash1(fi*5.1)+t*spd)*1.12;
    float wob=0.035*sin(t*(0.6+hash1(fi*2.2)*0.8)+fi);
    float rr=0.016 + hash1(fi*4.4)*0.030;
    vec2 dv=wp-vec2(sx+wob*asp, y); dv.y*=0.78;
    F += rr*rr/(dot(dv,dv)+0.0004);
  }
  F += smoothstep(0.15,0.0,uv.y)*1.2;                 // раскалённая лужа у дна
  // пузыри с кнопки
  for(int i=0;i<6;i++){ if(u_bub[i].z>0.001){ vec2 dv=wp-vec2(u_bub[i].x*asp,u_bub[i].y); dv.y*=0.8;
    F += u_bub[i].z*u_bub[i].z/(dot(dv,dv)+0.0006); } }
  // нагрев курсором
  if(u_pIn>0.5){ vec2 c=vec2(u_p.x*asp,u_p.y); float d2=dot(p-c,p-c); F += 0.010/(d2+0.0009); }

  vec3 bg=vec3(0.015,0.004,0.008);                    // почти чёрный фон
  float m=smoothstep(2.0,2.8,F);                       // блобы изолированы на чёрном (~30% покрытия)
  vec3 lava=mix(vec3(0.62,0.03,0.02), vec3(1.0,0.35,0.02), smoothstep(2.1,3.2,F));   // тёмно-красный → оранж
  lava=mix(lava, vec3(1.0,0.74,0.16), smoothstep(3.2,4.6,F));                         // → жёлтый
  lava=mix(lava, vec3(1.0,0.95,0.72), smoothstep(4.6,6.5,F));                         // → бело-горячее ядро
  vec3 col=bg;
  col += smoothstep(1.1,2.2,F)*0.26*vec3(1.0,0.25,0.05);   // тугой оранжевый ореол
  col = mix(col, lava, m);
  col += (hash(gl_FragCoord.xy)-0.5)/255.;
  fragColor=vec4(col,1.0);
}`;

function compile(t,src){ const s=gl.createShader(t); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
let prog;
try{ prog=gl.createProgram(); gl.attachShader(prog,compile(gl.VERTEX_SHADER,VERT));
  gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,FRAG)); gl.bindAttribLocation(prog,0,'a'); gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog)); gl.useProgram(prog);
}catch(e){ fail('GLSL: '+e.message); return; }
const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const L=(n)=>gl.getUniformLocation(prog,n);
function resize(){ const dpr=Math.min(devicePixelRatio||1,2);
  const w=Math.max(1,Math.round(canvas.clientWidth*dpr)), h=Math.max(1,Math.round(canvas.clientHeight*dpr));
  if(canvas.width!==w||canvas.height!==h){ canvas.width=w; canvas.height=h; gl.viewport(0,0,w,h); } }
new ResizeObserver(resize).observe(canvas); resize();

const ptr={x:0.5,y:0.5,inside:false};
let touched=false; const hintEl=document.getElementById('hint');
function markTouched(){ if(!touched){ touched=true; if(hintEl) hintEl.style.opacity='0'; } }
canvas.addEventListener('pointermove',e=>{ const r=canvas.getBoundingClientRect();
  ptr.x=(e.clientX-r.left)/r.width; ptr.y=1-(e.clientY-r.top)/r.height; ptr.inside=true; markTouched(); });
canvas.addEventListener('pointerleave',()=> ptr.inside=false);
canvas.addEventListener('pointerdown',e=>{ const r=canvas.getBoundingClientRect();
  ptr.x=(e.clientX-r.left)/r.width; ptr.y=1-(e.clientY-r.top)/r.height; ptr.inside=true; markTouched(); });

let heat=0.45;
const heatEl=document.getElementById('heat'), heatVal=document.getElementById('heatVal');
heatEl.oninput=()=>{ heat=parseFloat(heatEl.value); heatVal.textContent=Math.round(heat*100)+'%'; };

const bubbles=[];   // {x,y,vy,r}
document.getElementById('bloop').onclick=()=>{
  if(bubbles.length<6) bubbles.push({x:0.25+Math.random()*0.5, y:-0.03, vy:0.05+Math.random()*0.04, r:0.075+Math.random()*0.03});
};

const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const bubBuf=new Float32Array(18);
let last=performance.now();
function frame(now){
  const dt=Math.min((now-last)/1000,0.05); last=now;
  // обновляем пузыри (поднимаются, слегка виляют, растворяются вверху)
  for(let i=bubbles.length-1;i>=0;i--){ const b=bubbles[i];
    b.y += b.vy*(0.4+heat)*dt*3.0; b.x += Math.sin((now/1000+i)*0.8)*0.02*dt;
    if(b.y>1.06){ bubbles.splice(i,1); } }
  bubBuf.fill(0);
  for(let i=0;i<Math.min(bubbles.length,6);i++){ bubBuf[i*3]=bubbles[i].x; bubBuf[i*3+1]=bubbles[i].y; bubBuf[i*3+2]=bubbles[i].r; }

  gl.uniform2f(L('u_res'),canvas.width,canvas.height);
  gl.uniform1f(L('u_time'), reduceMotion?20.0:now/1000);   /* reduce: воск статичен, нагрев и пузыри — от действий */
  gl.uniform1f(L('u_heat'),heat);
  gl.uniform2f(L('u_p'),ptr.x,ptr.y);
  gl.uniform1f(L('u_pIn'),ptr.inside?1:0);
  gl.uniform3fv(L('u_bub[0]'),bubBuf);
  gl.drawArrays(gl.TRIANGLES,0,3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
<script>
(function(){ var q=new URLSearchParams(location.search);
  if(q.has('embed')){ var e=document.querySelector('.back'); if(e)e.remove(); }
  var b=document.querySelector('.back');
  if(b && !matchMedia('(prefers-reduced-motion: reduce)').matches){ b.addEventListener('click',function(ev){ ev.preventDefault(); document.body.classList.add('leaving'); setTimeout(function(){ location.href=b.getAttribute('href'); },175); }); }
})();
</script>
</body>
</html>
