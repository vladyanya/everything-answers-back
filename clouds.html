<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Drifting sky — Vladislav Chumachenko</title>
<style>
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; color:#f2f3f6;
    background:radial-gradient(120% 80% at 50% -10%, #14161d 0%, #050506 60%) fixed, #050506;
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif; -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center; padding:28px; -webkit-tap-highlight-color:transparent; }

  .back{ position:fixed; left:20px; top:18px; z-index:9; display:inline-flex; align-items:center; gap:7px;
    padding:8px 13px 8px 11px; border-radius:999px; text-decoration:none;
    background:rgba(255,255,255,.08); color:#eaf2f6; border:1px solid rgba(255,255,255,.10);
    font:600 12.5px/1 -apple-system,Inter,sans-serif; backdrop-filter:blur(10px);
    transition:background .18s, transform .18s; }
  .back:hover{ background:rgba(255,255,255,.16); transform:translateX(-2px); }

  .screen{ position:relative; width:min(440px,100%); aspect-ratio:3/4; border-radius:34px; overflow:hidden;
    background:#0a1016; isolation:isolate; box-shadow:0 40px 90px rgba(0,0,0,.6), 0 4px 0 rgba(255,255,255,.05) inset; }
  .screen canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; cursor:crosshair; touch-action:none; }

  .frame{ position:absolute; inset:0; pointer-events:none; border-radius:inherit;
    box-shadow: inset 0 0 70px 22px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.30), inset 0 0 0 1px rgba(255,255,255,.07); }
  .topscrim{ position:absolute; inset:0; pointer-events:none; border-radius:inherit;
    background:linear-gradient(180deg, rgba(6,20,40,.34) 0%, rgba(6,20,40,0) 30%); }

  .head{ position:absolute; left:20px; right:20px; top:18px; z-index:2; pointer-events:none; text-shadow:0 1px 12px rgba(0,20,50,.4); }
  .head .k{ font:600 11px/1 ui-monospace,Menlo,monospace; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.5); }
  .head .n{ margin-top:6px; font-size:24px; font-weight:700; letter-spacing:-.02em; color:#fff; }

  .bar{ position:absolute; left:14px; right:14px; bottom:14px; z-index:3;
    display:flex; align-items:center; gap:12px; padding:11px 11px 11px 16px;
    background:rgba(10,16,22,.42); border:1px solid rgba(255,255,255,.10); border-radius:20px;
    backdrop-filter:blur(16px) saturate(1.2); box-shadow:0 8px 30px rgba(0,0,0,.35); }
  .bar .lab{ font:600 11px/1.1 -apple-system,Inter,sans-serif; color:rgba(255,255,255,.85); width:36px; flex:none; letter-spacing:.02em; }
  .rng{ -webkit-appearance:none; appearance:none; flex:1; height:6px; border-radius:999px; outline:none;
    background:linear-gradient(90deg, rgba(255,255,255,.18), #bcd8ff); }
  .rng::-webkit-slider-thumb{ -webkit-appearance:none; width:20px; height:20px; border-radius:50%; cursor:pointer; background:#fff; box-shadow:0 2px 8px rgba(0,0,0,.4); }
  .rng::-moz-range-thumb{ width:20px; height:20px; border:none; border-radius:50%; background:#fff; cursor:pointer; }
  .val{ font:11px/1 ui-monospace,Menlo,monospace; color:#cfe2ff; width:32px; text-align:right; flex:none; }
  .fab{ width:44px; height:44px; flex:none; border:none; border-radius:50%; cursor:pointer; background:#fff; color:#0a1016;
    display:flex; align-items:center; justify-content:center; box-shadow:0 6px 18px rgba(0,0,0,.4); transition:transform .12s; }
  .fab:hover{ transform:translateY(-2px); } .fab:active{ transform:translateY(0) scale(.94); }

  .err{ position:absolute; left:14px; right:14px; bottom:74px; z-index:4; display:none;
    background:#2a1418; border:1px solid #ff6b6b; color:#ffb3b3; border-radius:12px; padding:12px 14px;
    font:12px ui-monospace,Menlo,monospace; white-space:pre-wrap; }

  @media (max-width:520px){
    body{ padding:0; align-items:stretch; }
    .screen{ width:100%; height:100%; border-radius:0; aspect-ratio:auto; }
    .back{ background:rgba(255,255,255,.14); }
    .rng{ height:8px; }                              /* крупнее touch-таргет на мобилке */
    .rng::-webkit-slider-thumb{ width:26px; height:26px; }
    .rng::-moz-range-thumb{ width:26px; height:26px; }
  }
  @keyframes pageFade{ from{ opacity:0; } to{ opacity:1; } }
  @media (prefers-reduced-motion: no-preference){
    body{ animation:pageFade .3s ease both; }
    body.leaving{ opacity:0; transition:opacity .17s ease; animation:none; }
  }
</style>
</head>
<body>
<a class="back" href="./index.html">← back</a>
<div class="screen">
  <canvas id="c"></canvas>
  <div class="frame"></div>
  <div class="topscrim"></div>
  <div class="bar">
    <span class="lab">Wind</span>
    <input class="rng" id="wind" type="range" min="0" max="1" step="0.01" value="0.35">
    <span class="val" id="windVal">35%</span>
    <button class="fab" id="gust" aria-label="New sky" title="New sky">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v5h-5"/>
      </svg>
    </button>
  </div>
  <div class="err" id="err"></div>
</div>

<script>
/* Дрейфующие кучевые облака: fbm + домен-варп. Слайдер — сила ветра (скорость + облачность).
   Курсор — «дыхание»: расталкивает и разрежает облака вокруг себя. Кнопка — новое небо. */
(function(){
const canvas=document.getElementById('c');
const errBox=document.getElementById('err');
const gl=canvas.getContext('webgl2',{antialias:false,alpha:false,powerPreference:'high-performance'});
function fail(m){ errBox.style.display='block'; errBox.textContent=m; }
if(!gl){ fail('WebGL2 не поддерживается этим браузером.'); return; }

const VERT=`#version 300 es
in vec2 a; void main(){ gl_Position=vec4(a,0.,1.); }`;

const FRAG=`#version 300 es
precision highp float;
uniform vec2  u_res;
uniform float u_time;
uniform float u_wind;     // 0..1 — скорость дрейфа
uniform vec2  u_seed;     // смещение поля → «новое небо» по кнопке
uniform vec2  u_p;        // курсор 0..1 (uv)
uniform float u_blow;     // сила «дыхания» (ease в JS)
out vec4 fragColor;

float hash(vec2 p){ p=fract(p*vec2(127.1,311.7)); p+=dot(p,p+34.5); return fract(p.x*p.y); }
float noise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);
  float a=hash(i),b=hash(i+vec2(1,0)),c=hash(i+vec2(0,1)),d=hash(i+vec2(1,1));
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y); }
float fbm(vec2 p){ float s=0.,a=.5; for(int i=0;i<6;i++){ s+=a*noise(p); p*=2.02; a*=.5; } return s; }

// плотность кучевого облака: крупные КОМКИ (где формируется масса) + клубящаяся форма внутри.
// между комками — чистое небо, поэтому облака читаются как отдельные пухлые кучи.
float cloudD(vec2 p){
  float big   = fbm(p*0.35 + 2.0);
  float m1    = smoothstep(0.54, 0.68, big);             // крупные массы
  float small = fbm(p*0.75 + 17.0);
  float m2    = smoothstep(0.63, 0.75, small) * 0.70;    // разрозненные мелкие кучки
  float mask  = max(m1, m2);
  vec2  w     = vec2(fbm(p*0.9 + 11.0), fbm(p*0.9 + 41.0));
  float shape = fbm(p*1.4 + w*1.6);                       // клубы «цветной капусты»
  shape = shape*shape;
  return clamp(mask * (0.5 + 0.9*shape), 0.0, 1.0);
}

void main(){
  vec2 uv=gl_FragCoord.xy/u_res;
  float asp=u_res.x/u_res.y;

  // насыщенное голубое небо: глубокий верх → бледный горизонт (как на фото)
  vec3 top=vec3(0.16,0.47,0.86), hor=vec3(0.74,0.86,0.97);
  vec3 col=mix(hor, top, smoothstep(0.0,1.0,uv.y));

  // «дыхание»: курсор расталкивает облачное поле от себя
  vec2 duv = uv - u_p; duv.x *= asp;
  float d2 = dot(duv, duv);
  float bl = u_blow * exp(-d2*20.0);
  vec2 buv = uv + (duv / max(sqrt(d2), 1e-3)) * bl * 0.075;

  // координата облачного поля; x чуть сжат (уже) → облака не «горизонтальные»
  float speed = 0.012 + u_wind*0.10;
  vec2 p = vec2(buv.x*asp*1.15, buv.y) * 4.5 + vec2(u_time*speed*4.5, 0.0) + u_seed;

  // плотность (крупные массы + мелкие кучки) и её «объём»
  float e = 0.03;
  float D  = cloudD(p);
  D *= 1.0 - 0.55*u_blow*exp(-d2*13.0);   // облака редеют под дыханием
  float Dx = cloudD(p + vec2(e,0.)) - D;
  float Dy = cloudD(p + vec2(0.,e)) - D;
  vec3 n = normalize(vec3(-Dx, -Dy, 0.6));
  vec3 L = normalize(vec3(-0.3, 0.85, 0.4));           // солнце сверху-слева
  float lit = clamp(0.72 + 0.42*dot(n, L), 0.0, 1.2);

  vec3 shadow = vec3(0.80,0.84,0.92);
  vec3 cloudCol = mix(shadow, vec3(1.0), clamp(lit,0.0,1.0));

  // пушистые кучи с мягкой кромкой; между комками — чистое небо
  float rim   = smoothstep(0.20, 0.44, D);
  float alpha = smoothstep(0.34, 0.64, D);
  col = mix(col, mix(shadow, vec3(1.0), 0.55), rim*0.40);
  col = mix(col, cloudCol, alpha);

  // солнечный ореол за облаками сверху
  float sun = smoothstep(0.9,0.0, length((uv-vec2(0.32,0.9))*vec2(asp,1.0)));
  col += sun*0.05;

  col += (hash(gl_FragCoord.xy)-0.5)/255.;
  fragColor=vec4(col,1.0);
}`;

function compile(t,src){ const s=gl.createShader(t); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){ throw new Error(gl.getShaderInfoLog(s)); } return s; }
let prog;
try{ prog=gl.createProgram(); gl.attachShader(prog,compile(gl.VERTEX_SHADER,VERT));
  gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,FRAG)); gl.bindAttribLocation(prog,0,'a'); gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog)); gl.useProgram(prog);
}catch(e){ fail('GLSL: '+e.message); return; }

const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);

const L=(n)=>gl.getUniformLocation(prog,n);
function resize(){ const dpr=Math.min(devicePixelRatio||1,2);
  const w=Math.max(1,Math.round(canvas.clientWidth*dpr)), h=Math.max(1,Math.round(canvas.clientHeight*dpr));
  if(canvas.width!==w||canvas.height!==h){ canvas.width=w; canvas.height=h; gl.viewport(0,0,w,h); } }
new ResizeObserver(resize).observe(canvas); resize();

const ptr={x:0.5,y:0.6,inside:false};
canvas.addEventListener('pointermove',e=>{ const r=canvas.getBoundingClientRect();
  ptr.x=(e.clientX-r.left)/r.width; ptr.y=1-(e.clientY-r.top)/r.height; ptr.inside=true; });
canvas.addEventListener('pointerdown',e=>{ const r=canvas.getBoundingClientRect();
  ptr.x=(e.clientX-r.left)/r.width; ptr.y=1-(e.clientY-r.top)/r.height; ptr.inside=true; });
canvas.addEventListener('pointerleave',()=> ptr.inside=false);

let wind=0.35;
const windEl=document.getElementById('wind'), windVal=document.getElementById('windVal');
windEl.oninput=()=>{ wind=parseFloat(windEl.value); windVal.textContent=Math.round(wind*100)+'%'; };

// кнопка = «новое небо»: рандомно перетасовываем облачное поле, плавно перетекаем
const seed={x:0,y:0}, seedT={x:0,y:0};
document.getElementById('gust').onclick=()=>{ seedT.x=Math.random()*120-60; seedT.y=Math.random()*120-60; };

const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
let blow=0;
let last=performance.now();
function frame(now){
  const dt=Math.min((now-last)/1000,0.05); last=now;
  const k=Math.min(dt*1.4, 1.0);                     // плавный переход к новому небу
  seed.x+=(seedT.x-seed.x)*k; seed.y+=(seedT.y-seed.y)*k;
  blow += ((ptr.inside?1:0)-blow)*Math.min(dt*3.5,1);   // дыхание плавно набирает/спадает
  gl.uniform2f(L('u_res'),canvas.width,canvas.height);
  gl.uniform1f(L('u_time'), reduceMotion?7.0:now/1000);   /* reduce: небо статично, дыхание работает */
  gl.uniform1f(L('u_wind'),wind);
  gl.uniform2f(L('u_seed'),seed.x,seed.y);
  gl.uniform2f(L('u_p'),ptr.x,ptr.y);
  gl.uniform1f(L('u_blow'),blow);
  gl.drawArrays(gl.TRIANGLES,0,3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
<script>
(function(){ var q=new URLSearchParams(location.search);
  if(q.has('embed')){ var e=document.querySelector('.back'); if(e)e.remove(); }
  var b=document.querySelector('.back');
  var from=q.get('from'); if(b && from && /^[\w-]+\.html(#[\w-]*)?$/.test(from)) b.setAttribute('href','./'+from);   // вернуться туда, откуда пришли (стенд)
  if(b && !matchMedia('(prefers-reduced-motion: reduce)').matches){ b.addEventListener('click',function(ev){ ev.preventDefault(); document.body.classList.add('leaving'); setTimeout(function(){ location.href=b.getAttribute('href'); },175); }); }
})();
</script>
</body>
</html>
