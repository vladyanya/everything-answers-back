<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Still water — Vladislav Chumachenko</title>
<style>
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; color:#f2f3f6;
    background:radial-gradient(120% 80% at 50% -10%, #14161d 0%, #050506 60%) fixed, #050506;
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif; -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center; padding:28px; -webkit-tap-highlight-color:transparent; }

  .back{ position:fixed; left:20px; top:18px; z-index:9; display:inline-flex; align-items:center; gap:7px;
    padding:8px 13px 8px 11px; border-radius:999px; text-decoration:none;
    background:rgba(255,255,255,.08); color:#eaf2f6; border:1px solid rgba(255,255,255,.10);
    font:600 12.5px/1 -apple-system,Inter,sans-serif; backdrop-filter:blur(10px);
    transition:background .18s, transform .18s; }
  .back:hover{ background:rgba(255,255,255,.16); transform:translateX(-2px); }

  .screen{ position:relative; width:min(440px,100%); aspect-ratio:3/4; border-radius:34px; overflow:hidden;
    background:#0a1016; isolation:isolate; box-shadow:0 40px 90px rgba(0,0,0,.6), 0 4px 0 rgba(255,255,255,.05) inset; }
  .screen canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; cursor:crosshair; touch-action:none; }

  /* inner shadow / стеклянный ободок */
  .frame{ position:absolute; inset:0; pointer-events:none; border-radius:inherit;
    box-shadow: inset 0 0 70px 22px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.28), inset 0 0 0 1px rgba(255,255,255,.07); }
  .topscrim{ position:absolute; inset:0; pointer-events:none; border-radius:inherit;
    background:linear-gradient(180deg, rgba(0,12,20,.42) 0%, rgba(0,12,20,0) 30%); }

  .head{ position:absolute; left:20px; right:20px; top:18px; z-index:2; pointer-events:none; text-shadow:0 1px 12px rgba(0,12,24,.45); }
  .head .wm{ display:flex; align-items:center; gap:8px; font:600 13px/1 -apple-system,Inter,sans-serif; color:#eef5f8; }
  .head .wm .g{ width:15px; height:15px; border-radius:5px; background:linear-gradient(140deg,#6fe0f0,#2aa6e0); box-shadow:0 0 14px rgba(90,210,240,.4); }
  .head .k{ margin-top:2px; font:600 11px/1 ui-monospace,Menlo,monospace; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.5); }
  .head .n{ margin-top:6px; font-size:24px; font-weight:700; letter-spacing:-.02em; color:#fff; }

  .bar{ position:absolute; left:14px; right:14px; bottom:14px; z-index:3;
    display:flex; align-items:center; gap:12px; padding:11px 11px 11px 16px;
    background:rgba(10,16,22,.42); border:1px solid rgba(255,255,255,.10); border-radius:20px;
    backdrop-filter:blur(16px) saturate(1.2); box-shadow:0 8px 30px rgba(0,0,0,.35); }
  .bar .lab{ font:600 11px/1.1 -apple-system,Inter,sans-serif; color:rgba(255,255,255,.85); width:56px; flex:none; letter-spacing:.02em; }
  .rng{ -webkit-appearance:none; appearance:none; flex:1; height:6px; border-radius:999px; outline:none;
    background:linear-gradient(90deg, rgba(255,255,255,.18), #4fd4e8); }
  .rng::-webkit-slider-thumb{ -webkit-appearance:none; width:20px; height:20px; border-radius:50%; cursor:pointer; background:#fff; box-shadow:0 2px 8px rgba(0,0,0,.4); }
  .rng::-moz-range-thumb{ width:20px; height:20px; border:none; border-radius:50%; background:#fff; cursor:pointer; }
  .val{ font:11px/1 ui-monospace,Menlo,monospace; color:#8fe3f2; width:32px; text-align:right; flex:none; }
  .fab{ width:44px; height:44px; flex:none; border:none; border-radius:50%; cursor:pointer; background:#fff; color:#0a1016;
    display:flex; align-items:center; justify-content:center; box-shadow:0 6px 18px rgba(0,0,0,.4); transition:transform .12s; }
  .fab:hover{ transform:translateY(-2px); } .fab:active{ transform:translateY(0) scale(.94); }

  .err{ position:absolute; left:14px; right:14px; bottom:74px; z-index:4; display:none;
    background:#2a1418; border:1px solid #ff6b6b; color:#ffb3b3; border-radius:12px; padding:12px 14px;
    font:12px ui-monospace,Menlo,monospace; white-space:pre-wrap; }

  @media (max-width:520px){
    body{ padding:0; align-items:stretch; }
    .screen{ width:100%; height:100%; border-radius:0; aspect-ratio:auto; }
    .back{ background:rgba(255,255,255,.14); }
    .rng{ height:8px; }                              /* крупнее touch-таргет на мобилке */
    .rng::-webkit-slider-thumb{ width:26px; height:26px; }
    .rng::-moz-range-thumb{ width:26px; height:26px; }
  }
  @keyframes pageFade{ from{ opacity:0; } to{ opacity:1; } }
  @media (prefers-reduced-motion: no-preference){
    body{ animation:pageFade .3s ease both; }
    body.leaving{ opacity:0; transition:opacity .17s ease; animation:none; }
  }
</style>
</head>
<body>
<a class="back" href="./index.html">← back</a>
<div class="screen">
  <canvas id="c"></canvas>
  <div class="frame"></div>
  <div class="topscrim"></div>
  <div class="bar">
    <span class="lab">Liveliness</span>
    <input class="rng" id="live" type="range" min="0" max="1" step="0.01" value="0.25">
    <span class="val" id="liveVal">25%</span>
    <button class="fab" id="drop" aria-label="Drop a stone" title="Drop a stone">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.6s6.4 6.9 6.4 11.4a6.4 6.4 0 1 1-12.8 0C5.6 9.5 12 2.6 12 2.6z"/></svg>
    </button>
  </div>
  <div class="err" id="err"></div>
</div>
<script>
(function(){
const canvas=document.getElementById('c');
const errBox=document.getElementById('err');
const gl=canvas.getContext('webgl2',{antialias:false,alpha:false,powerPreference:'high-performance'});
function fail(m){ errBox.style.display='block'; errBox.textContent=m; }
if(!gl){ fail('WebGL2 не поддерживается этим браузером.'); return; }
let SIGNED=false, stateInternal, stateType;
{ const eF=gl.getExtension('EXT_color_buffer_float'), eH=gl.getExtension('EXT_color_buffer_half_float');
  if(eF||eH){ SIGNED=true; stateInternal=gl.RGBA16F; stateType=gl.HALF_FLOAT; } else { stateInternal=gl.RGBA8; stateType=gl.UNSIGNED_BYTE; }
  gl.getExtension('OES_texture_float_linear'); }
gl.bindVertexArray(gl.createVertexArray());
{ const b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0); }
const VERT='#version 300 es\nin vec2 a_position; void main(){ gl_Position=vec4(a_position,0.,1.); }';
const CODEC = SIGNED ? '#define ENC(x) (x)\n#define DEC(x) (x)' : '#define ENC(x) ((x)*0.5+0.5)\n#define DEC(x) (((x)-0.5)*2.0)';
const HEAD='#version 300 es\nprecision highp float;\nuniform vec2 u_res;\nout vec4 fragColor;\n'+CODEC+'\nvec2 uv0(){ return gl_FragCoord.xy/u_res; }\n';
const SIM = `
uniform sampler2D u_prev;
uniform vec2  u_p;        // курсор 0..1
uniform vec2  u_pPrev;    // курсор в прошлом кадре
uniform float u_inject;   // сила следа (растёт со скоростью курсора)
uniform float u_drop;     // разовая капля (клик)
uniform vec2  u_rain;     // позиция капли дождя
uniform float u_rainAmt;  // сила капли дождя (0, если дождя нет в этом кадре)
uniform float u_damp;
uniform float u_force;
uniform float u_clear;

float H(vec2 uv){ return DEC(texture(u_prev, uv).r); }

// расстояние от точки до отрезка — гладкий след при драге
float segDist(vec2 p, vec2 a, vec2 b){
  vec2 pa = p - a, ba = b - a;
  float t = clamp(dot(pa, ba)/max(dot(ba, ba), 1e-6), 0., 1.);
  return length(pa - ba*t);
}

void main(){
  vec2 uv = uv0();
  vec2 texel = 1./u_res;
  float asp = u_res.x/u_res.y;

  float h  = H(uv);
  float hp = DEC(texture(u_prev, uv).g);

  // лапласиан по 4 соседям
  float l = H(uv - vec2(texel.x,0.));
  float r = H(uv + vec2(texel.x,0.));
  float u = H(uv + vec2(0.,texel.y));
  float d = H(uv - vec2(0.,texel.y));

  float nh = (l + r + u + d) * 0.5 - hp;   // волновое уравнение
  nh *= u_damp;                             // вязкость

  // затухание у краёв, чтобы отражения не копили энергию в углах
  vec2 e = min(uv, 1.-uv);
  float border = smoothstep(0., 0.03, min(e.x, e.y));
  nh *= mix(0.9, 1.0, border);

  // след курсора вдоль отрезка (аспект учтён)
  vec2 P = uv*vec2(asp,1.), A = u_pPrev*vec2(asp,1.), B = u_p*vec2(asp,1.);
  nh -= u_inject * u_force * smoothstep(0.02, 0., segDist(P, A, B));

  // капля по клику
  nh -= u_drop * smoothstep(0.05, 0., length((uv - u_p)*vec2(asp,1.)));

  // капля дождя
  nh -= u_rainAmt * smoothstep(0.035, 0., length((uv - u_rain)*vec2(asp,1.)));

  nh *= (1. - u_clear);                     // «успокоить»

  fragColor = vec4(ENC(nh), ENC(h), 0., 1.);   // .g нового кадра = .r старого
}`;
const RENDER = `
uniform sampler2D u_state;
uniform float u_time;
uniform float u_refract;
uniform float u_spec;
uniform float u_caustic;
uniform float u_flow;
uniform vec3  u_water;   // глубокая бирюза
uniform vec3  u_sky;     // светлая бирюза / блики

float H(vec2 uv){ return DEC(texture(u_state, uv).r); }

// сетка каустик (свет на дне бассейна): анимируется на месте через t
float caustic(vec2 uv, float t){
  mat2 m = mat2(cos(.5), sin(.5), -sin(.5), cos(.5));
  vec2 n = vec2(0.1); vec2 N = vec2(0.1); float scale = 1.4;
  for (int i=0;i<6;i++){ uv*=m; n*=m;
    vec2 q = uv*scale + float(i) + n + (mod(float(i),2.)*2.-1.)*(0.4+0.4*float(i))*t;
    n += sin(q); N += cos(q)/scale; scale *= 1.1; }
  float c=(N.x+N.y+1.0); return c*c;
}

void main(){
  vec2 uv=uv0(); vec2 texel=1./u_res; float asp=u_res.x/u_res.y;

  float h  = H(uv);
  float hx = H(uv+vec2(texel.x,0.)) - H(uv-vec2(texel.x,0.));
  float hy = H(uv+vec2(0.,texel.y)) - H(uv-vec2(0.,texel.y));
  vec3  n  = normalize(vec3(-hx, -hy, 0.06));
  float slope = length(vec2(hx, hy));

  // база: бирюзовый градиент воды
  vec3 col = mix(u_water, u_sky, smoothstep(0.0, 1.0, uv.y));
  float glow = smoothstep(1.1,0.0,length((uv-vec2(0.5,0.72))*vec2(asp,1.0)));
  col += glow*0.06;

  // КАУСТИКА: рябь искажает координату сетки → трогаешь и свет плывёт под пальцем
  vec2 cuv = uv + n.xy * u_refract * 0.12;
  float c = clamp(caustic(cuv*3.0, u_time*u_flow), 0.0, 3.0);

  // яркие тонкие вены света (то самое «переливается»)
  float veins = smoothstep(0.85, 1.9, c);
  col = mix(col, vec3(1.0), veins * u_caustic * 0.55);
  // мягкое свечение между венами
  col += (c - 1.0) * 0.05 * u_caustic;

  // контраст ряби: гребни светлее, впадины темнее, контур по склонам
  float shade = clamp(h*2.6, -0.55, 0.55);
  col *= 1.0 + shade*0.28;
  col *= 1.0 - min(slope*3.0, 0.6)*0.16;

  // солнечные искры на гребнях
  vec3 Ldir = normalize(vec3(0.4, 0.7, 0.6));
  float spec = pow(max(dot(n, Ldir), 0.0), 110.0);
  col += spec * u_spec * vec3(1.0);

  // стеклянный френель к светлой бирюзе
  col = mix(col, u_sky, pow(1.0-max(n.z,0.0),4.0)*0.15);

  col += (fract(sin(dot(gl_FragCoord.xy, vec2(12.9898,78.233)))*43758.5453)-0.5)/256.;
  fragColor = vec4(col, 1.0);
}`;
function compile(t,src){ const s=gl.createShader(t); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
function program(frag){ const p=gl.createProgram();
  gl.attachShader(p,compile(gl.VERTEX_SHADER,VERT)); gl.attachShader(p,compile(gl.FRAGMENT_SHADER,HEAD+'\n'+frag));
  gl.bindAttribLocation(p,0,'a_position'); gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p)); return p; }
let progSim, progRender;
try{ progSim=program(SIM); progRender=program(RENDER); }catch(e){ fail('GLSL: '+e.message); return; }
const SIM_SCALE=0.5; let A,B,sw,sh;
function mk(w,h){ const tex=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texImage2D(gl.TEXTURE_2D,0,stateInternal,w,h,0,gl.RGBA,stateType,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  const fbo=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
  const base=SIGNED?0:0.5; gl.clearColor(base,base,0,1); gl.clear(gl.COLOR_BUFFER_BIT); return {tex,fbo}; }
function alloc(){ sw=Math.max(2,Math.round(canvas.width*SIM_SCALE)); sh=Math.max(2,Math.round(canvas.height*SIM_SCALE));
  if(A){gl.deleteTexture(A.tex);gl.deleteFramebuffer(A.fbo);} if(B){gl.deleteTexture(B.tex);gl.deleteFramebuffer(B.fbo);}
  A=mk(sw,sh); B=mk(sw,sh); gl.bindFramebuffer(gl.FRAMEBUFFER,null); }
function resize(){ const dpr=Math.min(window.devicePixelRatio||1,2);
  const w=Math.max(1,Math.round(canvas.clientWidth*dpr)), h=Math.max(1,Math.round(canvas.clientHeight*dpr));
  if(canvas.width!==w||canvas.height!==h){ canvas.width=w; canvas.height=h; alloc(); } }
new ResizeObserver(resize).observe(canvas);
const ptr={x:0.5,y:0.5,px:0.5,py:0.5,inside:false,speed:0};
canvas.addEventListener('pointermove',e=>{ const r=canvas.getBoundingClientRect();
  ptr.x=(e.clientX-r.left)/r.width; ptr.y=1-(e.clientY-r.top)/r.height; ptr.inside=true; });
canvas.addEventListener('pointerleave',()=> ptr.inside=false);
canvas.addEventListener('pointerdown',e=>{ const r=canvas.getBoundingClientRect();
  ptr.x=(e.clientX-r.left)/r.width; ptr.y=1-(e.clientY-r.top)/r.height; drop.pending=true; drop.x=ptr.x; drop.y=ptr.y; });
const drop={pending:false,x:0.5,y:0.62};
document.getElementById('drop').onclick=()=>{ drop.pending=true; drop.x=0.5; drop.y=0.6; };
let live=0.25;
const liveEl=document.getElementById('live'), liveVal=document.getElementById('liveVal');
liveEl.oninput=()=>{ live=parseFloat(liveEl.value); liveVal.textContent=Math.round(live*100)+'%'; };
const WATER=[0.086,0.588,0.706], SKY=[0.706,0.933,0.969];
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const L=(p,n)=>gl.getUniformLocation(p,n);
let last=performance.now();
function frame(now){
  const dt=Math.min((now-last)/1000,0.05); last=now;
  const dx=ptr.x-ptr.px, dy=ptr.y-ptr.py; ptr.speed=Math.min(Math.hypot(dx,dy)/Math.max(dt,1e-3),6);
  const inject=ptr.inside?Math.min(0.15+ptr.speed*0.5,1.2):0;
  const dropAmt=drop.pending?1.0:0.0;
  let rainX=0,rainY=0,rainAmt=0;
  /* вероятность × dt — частота дождя не зависит от герцовки экрана (~8 капель/с при 100%);
     при prefers-reduced-motion автодождь выключен (волны от касания остаются) */
  if(!reduceMotion && live>0 && Math.random() < live*8.4*dt){ rainX=Math.random(); rainY=Math.random(); rainAmt=0.4+0.5*live; }
  let read=A, write=B;
  for(let i=0;i<2;i++){
    gl.useProgram(progSim); gl.bindFramebuffer(gl.FRAMEBUFFER,write.fbo); gl.viewport(0,0,sw,sh);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,read.tex);
    gl.uniform1i(L(progSim,'u_prev'),0); gl.uniform2f(L(progSim,'u_res'),sw,sh);
    gl.uniform2f(L(progSim,'u_p'), drop.pending?drop.x:ptr.x, drop.pending?drop.y:ptr.y);
    gl.uniform2f(L(progSim,'u_pPrev'),ptr.px,ptr.py);
    gl.uniform1f(L(progSim,'u_inject'), inject/2);
    gl.uniform1f(L(progSim,'u_drop'), i===0?dropAmt:0);
    gl.uniform2f(L(progSim,'u_rain'),rainX,rainY); gl.uniform1f(L(progSim,'u_rainAmt'), i===0?rainAmt:0);
    gl.uniform1f(L(progSim,'u_damp'),0.99); gl.uniform1f(L(progSim,'u_force'),0.9); gl.uniform1f(L(progSim,'u_clear'),0);
    gl.drawArrays(gl.TRIANGLES,0,3); const t=read; read=write; write=t;
  }
  drop.pending=false; ptr.px=ptr.x; ptr.py=ptr.y;
  gl.useProgram(progRender); gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.viewport(0,0,canvas.width,canvas.height);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,read.tex);
  gl.uniform1i(L(progRender,'u_state'),0); gl.uniform2f(L(progRender,'u_res'),canvas.width,canvas.height);
  gl.uniform1f(L(progRender,'u_time'), reduceMotion?5.0:now/1000);   /* reduce: каустика статична */
  gl.uniform1f(L(progRender,'u_refract'),1.3); gl.uniform1f(L(progRender,'u_spec'),1.0);
  gl.uniform1f(L(progRender,'u_caustic'),1.3); gl.uniform1f(L(progRender,'u_flow'),0.35);
  gl.uniform3f(L(progRender,'u_water'),WATER[0],WATER[1],WATER[2]); gl.uniform3f(L(progRender,'u_sky'),SKY[0],SKY[1],SKY[2]);
  gl.drawArrays(gl.TRIANGLES,0,3);
  requestAnimationFrame(frame);
}
resize(); requestAnimationFrame(frame);
})();
</script>
<script>
(function(){ var q=new URLSearchParams(location.search);
  if(q.has('embed')){ var e=document.querySelector('.back'); if(e)e.remove(); }
  var b=document.querySelector('.back');
  if(b && !matchMedia('(prefers-reduced-motion: reduce)').matches){ b.addEventListener('click',function(ev){ ev.preventDefault(); document.body.classList.add('leaving'); setTimeout(function(){ location.href=b.getAttribute('href'); },175); }); }
})();
</script>
</body>
</html>
