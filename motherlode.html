<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Motherlode — Vladislav Chumachenko</title>
<style>
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; color:#f2f3f6; overflow:hidden;
    background:radial-gradient(120% 80% at 50% -10%, #14161d 0%, #050506 60%) fixed, #050506;
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif; -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center; padding:28px; -webkit-tap-highlight-color:transparent; }

  .back{ position:fixed; left:20px; top:18px; z-index:9; display:inline-flex; align-items:center; gap:7px;
    padding:8px 13px 8px 11px; border-radius:999px; text-decoration:none;
    background:rgba(255,255,255,.08); color:#eaf2f6; border:1px solid rgba(255,255,255,.10);
    font:600 12.5px/1 -apple-system,Inter,sans-serif; backdrop-filter:blur(10px);
    transition:background .18s, transform .18s; }
  .back:hover{ background:rgba(255,255,255,.16); transform:translateX(-2px); }

  .screen{ position:relative; width:min(440px,100%); aspect-ratio:3/4; border-radius:34px; overflow:hidden;
    background:#0b0d16; isolation:isolate; box-shadow:0 40px 90px rgba(0,0,0,.6), 0 4px 0 rgba(255,255,255,.05) inset; }
  .screen canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }

  .frame{ position:absolute; inset:0; pointer-events:none; border-radius:inherit;
    box-shadow: inset 0 0 70px 22px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.28), inset 0 0 0 1px rgba(255,255,255,.08); }
  .scrim{ position:absolute; inset:0; pointer-events:none; border-radius:inherit;
    background:linear-gradient(180deg, rgba(6,8,20,.45) 0%, rgba(6,8,20,0) 26%),
               linear-gradient(0deg, rgba(6,8,20,.55) 0%, rgba(6,8,20,0) 40%); }

  .head{ position:absolute; left:22px; right:22px; top:19px; z-index:2; pointer-events:none;
    display:flex; align-items:baseline; justify-content:space-between; text-shadow:0 1px 12px rgba(0,0,20,.5); }
  .head .wallet{ font-size:15px; font-weight:600; letter-spacing:-.01em; color:#fff; }
  .head .num{ font:12px/1 ui-monospace,Menlo,monospace; letter-spacing:.06em; color:rgba(255,255,255,.72); }

  .notes{ position:absolute; right:16px; top:52px; z-index:4; display:flex; flex-direction:column; align-items:flex-end; gap:8px; pointer-events:none; }
  .note{ display:inline-flex; align-items:center; gap:10px; max-width:82%;
    padding:9px 12px 9px 10px; border-radius:14px; background:rgba(10,12,24,.5); border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(14px); box-shadow:0 8px 24px rgba(0,0,0,.35);
    animation:noteIn .5s cubic-bezier(.2,.9,.2,1) both; }
  .note.out{ animation:noteOut .4s ease forwards; }
  .note .dot{ width:26px; height:26px; border-radius:50%; flex:none; box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35); }
  .note b{ font-size:13.5px; font-weight:700; color:#fff; }
  .note span{ font-size:12px; color:rgba(255,255,255,.72); }
  @keyframes noteIn{ from{ opacity:0; transform:translateX(18px) scale(.96); } to{ opacity:1; transform:none; } }
  @keyframes noteOut{ to{ opacity:0; transform:translateX(12px); } }

  .center{ position:absolute; left:0; right:0; top:47%; transform:translateY(-50%); z-index:2; text-align:center; pointer-events:none; padding:0 20px; }
  .balance{ font-size:clamp(40px,12.5vw,62px); font-weight:800; letter-spacing:-.03em; color:#fff;
    text-shadow:0 2px 26px rgba(0,0,30,.45), 0 1px 2px rgba(0,0,0,.3); font-variant-numeric:tabular-nums; }
  .sub{ margin-top:8px; font-size:13px; font-weight:600; color:rgba(255,255,255,.8); text-shadow:0 1px 8px rgba(0,0,20,.5); }
  .wish{ margin-top:14px; font-size:12.5px; font-style:italic; color:rgba(255,255,255,.72); text-shadow:0 1px 8px rgba(0,0,20,.5); min-height:16px; }

  /* нижняя стеклянная панель — как в остальных карточках */
  .bar{ position:absolute; left:14px; right:14px; bottom:14px; z-index:3;
    display:flex; align-items:center; gap:10px; padding:9px;
    background:rgba(10,10,22,.42); border:1px solid rgba(255,255,255,.12); border-radius:20px;
    backdrop-filter:blur(16px) saturate(1.2); box-shadow:0 8px 30px rgba(0,0,0,.35); }
  .ghost{ width:44px; height:44px; flex:none; border-radius:12px; cursor:pointer;
    border:none; background:transparent; color:rgba(255,255,255,.8);
    display:flex; align-items:center; justify-content:center; transition:background .15s, color .15s, transform .1s; }
  .ghost:hover{ background:rgba(255,255,255,.10); color:#fff; } .ghost:active{ transform:scale(.94); }
  .add{ flex:1; height:44px; border:none; border-radius:14px; cursor:pointer; background:#fff; color:#111;
    display:flex; align-items:center; justify-content:center; gap:9px;
    font:800 15px/1 -apple-system,Inter,sans-serif; letter-spacing:-.01em;
    box-shadow:0 6px 18px rgba(0,0,0,.28); transition:transform .1s cubic-bezier(.2,.8,.2,1); }
  .add:active{ transform:scale(.97); }
  .add svg, .ghost svg{ display:block; }

  .jack{ position:absolute; left:0; right:0; top:32%; z-index:5; text-align:center; pointer-events:none;
    font:800 30px/1 -apple-system,Inter,sans-serif; letter-spacing:.02em; color:#fff6d6;
    text-shadow:0 0 26px rgba(255,220,120,.85); opacity:0; }

  .err{ position:absolute; left:14px; right:14px; bottom:76px; z-index:6; display:none;
    background:#2a1418; border:1px solid #ff6b6b; color:#ffb3b3; border-radius:12px; padding:12px 14px;
    font:12px ui-monospace,Menlo,monospace; white-space:pre-wrap; }

  @media (max-width:520px){
    body{ padding:0; align-items:stretch; }
    .screen{ width:100%; height:100%; border-radius:0; aspect-ratio:auto; }
    .back{ background:rgba(255,255,255,.14); }
  }
  @keyframes pageFade{ from{ opacity:0; } to{ opacity:1; } }
  @media (prefers-reduced-motion: no-preference){
    body{ animation:pageFade .3s ease both; }
    body.leaving{ opacity:0; transition:opacity .17s ease; animation:none; }
  }
</style>
</head>
<body>
<a class="back" href="./index.html">← back</a>
<div class="screen" id="screen">
  <canvas id="c"></canvas>
  <div class="frame"></div>
  <div class="scrim"></div>


  <div class="notes" id="notes"></div>
  <div class="jack" id="jack">JACKPOT</div>

  <div class="center">
    <div class="balance" id="bal">$0</div>
    <div class="sub">Total balance</div>
    <div class="wish" id="wish">tap and make a wish</div>
  </div>

  <div class="bar">
    <button class="ghost" id="reset" title="Reset" aria-label="Reset">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v5h-5"/>
      </svg>
    </button>
    <button class="add" id="add">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
        <path d="M12 5v14"/><path d="M5 12h14"/>
      </svg>
      Motherlode
    </button>
  </div>

  <div class="err" id="err"></div>
</div>

<script>
/* Motherlode / Lucky Wallet: tap to receive random money from mysterious senders.
   Silky mesh gradient (Apple-wallet vibe) warms toward gold as you get richer. */
(function(){
const canvas=document.getElementById('c');
const errBox=document.getElementById('err');
const gl=canvas.getContext('webgl2',{antialias:false,alpha:false,powerPreference:'high-performance'});
function fail(m){ errBox.style.display='block'; errBox.textContent=m; }
if(!gl){ fail('WebGL2 is not supported by this browser.'); return; }

const VERT=`#version 300 es
in vec2 a; void main(){ gl_Position=vec4(a,0.,1.); }`;

const FRAG=`#version 300 es
precision highp float;
uniform vec2  u_res;
uniform float u_time;
uniform float u_heat;     // короткий импульс при тапе (искра)
uniform float u_wealth;   // 0..1 — медленная ось «богатства» от баланса (лог-шкала)
out vec4 fragColor;

float hash(vec2 p){ return fract(sin(dot(p,vec2(41.3,289.1)))*43758.5453); }
float vnoise(vec2 p){
  vec2 i=floor(p), f=fract(p), u=f*f*(3.0-2.0*f);
  float a=hash(i), b=hash(i+vec2(1,0)), c=hash(i+vec2(0,1)), d=hash(i+vec2(1,1));
  return mix(mix(a,b,u.x),mix(c,d,u.x),u.y);
}
float fbm2(vec2 p){ float s=0.,a=.5; for(int i=0;i<5;i++){ s+=a*vnoise(p); p*=2.02; a*=.5; } return s; }
// денежная палитра: тёмно-зелёный → изумруд → кремовый (купюра) → золото
vec3 wpal(float x){ x=clamp(x,0.,1.);
  vec3 c0=vec3(0.06,0.30,0.17), c1=vec3(0.18,0.58,0.34), c2=vec3(0.86,0.93,0.78), c3=vec3(0.95,0.78,0.32);
  vec3 c=c0;
  c=mix(c,c1,smoothstep(0.0,0.33,x));
  c=mix(c,c2,smoothstep(0.33,0.66,x));
  c=mix(c,c3,smoothstep(0.66,1.0,x));
  return c; }

void main(){
  vec2 uv=gl_FragCoord.xy/u_res;
  vec2 p=uv; p.x*=u_res.x/u_res.y;
  float w=clamp(u_wealth,0.0,1.0);
  float tt=u_time*0.20;                            // спокойное течение

  // текущее закрученное поле → зелёно-золотая денежная палитра
  vec2 q=p*1.9;
  q += 1.0*vec2(fbm2(q+vec2(tt,1.0)), fbm2(q+vec2(4.0,-tt*0.8)));
  float n=fbm2(q*0.9+vec2(tt*0.6,0.0));
  n=(n-0.5)*1.9+0.5 + w*0.32 + u_heat*0.18;        // богатство/тап → сдвиг оттенка к золоту (ЦВЕТ, не яркость)
  vec3 col=wpal(n);

  // богатство = более насыщенная КРАСКА, а не выкрученная экспозиция
  float lum=dot(col,vec3(0.299,0.587,0.114));
  col=mix(vec3(lum), col, 0.80+0.32*w);            // насыщеннее с деньгами
  col=pow(col, vec3(0.94));

  col += (hash(gl_FragCoord.xy)-0.5)/255.;       // фикс бандинга
  fragColor=vec4(col,1.0);
}`;

function compile(t,src){ const s=gl.createShader(t); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
let prog;
try{ prog=gl.createProgram(); gl.attachShader(prog,compile(gl.VERTEX_SHADER,VERT));
  gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,FRAG)); gl.bindAttribLocation(prog,0,'a'); gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog)); gl.useProgram(prog);
}catch(e){ fail('GLSL: '+e.message); return; }
const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const L=(n)=>gl.getUniformLocation(prog,n);
function resize(){ const dpr=Math.min(devicePixelRatio||1,2);
  const w=Math.max(1,Math.round(canvas.clientWidth*dpr)), h=Math.max(1,Math.round(canvas.clientHeight*dpr));
  if(canvas.width!==w||canvas.height!==h){ canvas.width=w; canvas.height=h; gl.viewport(0,0,w,h); } }
new ResizeObserver(resize).observe(canvas); resize();

/* --- game --- */
const balEl=document.getElementById('bal'), wishEl=document.getElementById('wish'),
      jackEl=document.getElementById('jack'), addBtn=document.getElementById('add'),
      notesEl=document.getElementById('notes');
const fmt=(n)=>'$'+Math.floor(n).toLocaleString('en-US');

const DROPS=[
  {v:20,w:26},{v:100,w:22},{v:500,w:17},{v:2000,w:13},
  {v:20000,w:9},{v:250000,w:6},{v:1000000,w:5},{v:10000000,w:2}
];
const TOTW=DROPS.reduce((s,d)=>s+d.w,0);
function pick(){ let r=Math.random()*TOTW; for(const d of DROPS){ if((r-=d.w)<=0) return d.v; } return DROPS[0].v; }

const SENDERS=['God','the Universe','Destiny','Fate','Lady Luck','Fortune','Karma','a Stranger',
  'Grandma','the Void','your Future Self','Anonymous','the Algorithm','Santa','a Nigerian Prince','Fairy Godmother'];
const WISHES=['please be real…','please don’t be fake','no way this is real','manifesting…',
  'don’t wake me up','keep it coming','this can’t be legal'];
const DOTS=['#4f7cff','#8a5cff','#ff6b8a','#ffb84a','#3ecf8e','#ff8a3a','#59c1ff'];

let balance=0, shown=0, heat=0, wealth=0, taps=0;

function note(amt){
  const el=document.createElement('div'); el.className='note';
  const dot=document.createElement('span'); dot.className='dot';
  dot.style.background=DOTS[Math.floor(Math.random()*DOTS.length)];
  const txt=document.createElement('div');
  const who=SENDERS[Math.floor(Math.random()*SENDERS.length)];
  txt.innerHTML='<b>+ '+Math.floor(amt).toLocaleString('en-US')+'</b><br><span>From '+who+' — thank you!</span>';
  el.appendChild(dot); el.appendChild(txt);
  notesEl.appendChild(el);
  while(notesEl.children.length>3) notesEl.removeChild(notesEl.firstChild);
  setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>el.remove(),400); }, 1900);
}

function add(){
  const amt=pick();
  balance+=amt;
  taps++;
  heat=Math.min(heat + (amt>=1000000?1.4:0.45), 2.2);
  wishEl.textContent = WISHES[Math.floor(Math.random()*WISHES.length)];
  note(amt);
  if(amt>=10000000){ jackEl.textContent='MEGA JACKPOT'; flashJack(); }
  else if(amt>=1000000){ jackEl.textContent='JACKPOT'; flashJack(); }
}
function flashJack(){ jackEl.style.transition='none'; jackEl.style.opacity='1'; jackEl.style.transform='scale(1.05)';
  requestAnimationFrame(()=>{ jackEl.style.transition='opacity .9s, transform .9s'; jackEl.style.opacity='0'; jackEl.style.transform='scale(1.45)'; }); }
addBtn.addEventListener('click', add);
/* тап по самому кошельку — главный жест («tap and make a wish» обещает именно это) */
canvas.addEventListener('pointerdown', add);
document.getElementById('reset').onclick=()=>{ balance=0; heat=0; taps=0; wealth=0; wishEl.textContent='tap and make a wish'; notesEl.innerHTML=''; };
// цвет развивается и от числа тапов (каждый Add Money двигает), и от суммы (крупные деньги докрашивают до пика)
const wealthTarget=()=>{
  const tapCurve=Math.min(taps/22, 1);                                     // ~20 тапов → почти полный цвет
  const balCurve=Math.min(Math.max((Math.log10(balance+1)-3.0)/4.0,0),1);  // нужна крупная сумма ($100k→0.5, $10M→1)
  return Math.max(tapCurve*0.9, balCurve);                                  // финальный «пик» — за большие деньги
};

const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
let last=performance.now();
function frame(now){
  const dt=Math.min((now-last)/1000,0.05); last=now;
  heat=Math.max(0, heat - dt*0.5);
  wealth += (wealthTarget() - wealth) * Math.min(dt*2.4, 1);   // подтягиваем цвет (заметно на каждый тап)
  shown += (balance - shown) * Math.min(dt*6, 1);
  if(Math.abs(balance-shown)<1) shown=balance;
  balEl.textContent=fmt(shown);
  gl.uniform2f(L('u_res'),canvas.width,canvas.height);
  gl.uniform1f(L('u_time'), reduceMotion?9.0:now/1000);   /* reduce: течение статично, цвет богатства работает */
  gl.uniform1f(L('u_heat'),heat);
  gl.uniform1f(L('u_wealth'),wealth);
  gl.drawArrays(gl.TRIANGLES,0,3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
<script>
(function(){ var q=new URLSearchParams(location.search);
  if(q.has('embed')){ var e=document.querySelector('.back'); if(e)e.remove(); }
  var b=document.querySelector('.back');
  var from=q.get('from'); if(b && from && /^[\w-]+\.html(#[\w-]*)?$/.test(from)) b.setAttribute('href','./'+from);   // вернуться туда, откуда пришли (стенд)
  if(b && !matchMedia('(prefers-reduced-motion: reduce)').matches){ b.addEventListener('click',function(ev){ ev.preventDefault(); document.body.classList.add('leaving'); setTimeout(function(){ location.href=b.getAttribute('href'); },175); }); }
})();
</script>
</body>
</html>
