<script>
/* Превью-шейдер стихий: один общий фрагментный шейдер, режим на стихию. */
const FRAG = `#version 300 es
precision highp float;
uniform vec2  u_res;
uniform float u_time;
uniform int   u_mode;      // 0 вода, 1 облака, 2 трава
uniform vec3  u_c1;        // тёмный тон
uniform vec3  u_c2;        // светлый тон
out vec4 fragColor;

float hash(vec2 p){ p=fract(p*vec2(127.1,311.7)); p+=dot(p,p+34.5); return fract(p.x*p.y); }
float hash1(float n){ return fract(sin(n*127.1)*43758.5453); }
float noise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);
  float a=hash(i),b=hash(i+vec2(1,0)),c=hash(i+vec2(0,1)),d=hash(i+vec2(1,1));
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y); }
float fbm(vec2 p){ float s=0.,a=.5; for(int i=0;i<5;i++){ s+=a*noise(p); p*=2.03; a*=.5; } return s; }
float bands(vec2 p){ return 0.66*noise(p) + 0.24*noise(p*2.03+7.0) + 0.10*noise(p*4.10+19.0); }
float caustic(vec2 uv,float t){
  mat2 m=mat2(cos(.5),sin(.5),-sin(.5),cos(.5));
  vec2 n=vec2(.1),N=vec2(.1); float sc=1.4;
  for(int i=0;i<5;i++){ uv*=m; n*=m;
    vec2 q=uv*sc+float(i)+n+(mod(float(i),2.)*2.-1.)*(.4+.4*float(i))*t;
    n+=sin(q); N+=cos(q)/sc; sc*=1.1; }
  float c=(N.x+N.y+1.); return c*c;
}
// переливающаяся термо-палитра для карточки heatmap
vec3 pal(float t){ t=clamp(t,0.,1.);
  vec3 c0=vec3(0.05,0.03,0.18),c1=vec3(0.10,0.22,0.82),c2=vec3(0.05,0.64,0.82),
       c3=vec3(0.28,0.82,0.44),c4=vec3(0.98,0.88,0.26),c5=vec3(1.00,0.50,0.14),c6=vec3(1.00,0.80,0.64);
  vec3 c=c0;
  c=mix(c,c1,smoothstep(0.00,0.18,t)); c=mix(c,c2,smoothstep(0.18,0.36,t));
  c=mix(c,c3,smoothstep(0.36,0.52,t)); c=mix(c,c4,smoothstep(0.52,0.66,t));
  c=mix(c,c5,smoothstep(0.66,0.82,t)); c=mix(c,c6,smoothstep(0.82,1.00,t));
  return c; }
// денежная палитра кошелька: тёмно-зелёный → изумруд → кремовый (купюра) → золото
vec3 wpal(float x){ x=clamp(x,0.,1.);
  vec3 c0=vec3(0.06,0.30,0.17), c1=vec3(0.18,0.58,0.34), c2=vec3(0.86,0.93,0.78), c3=vec3(0.95,0.78,0.32);
  vec3 c=c0;
  c=mix(c,c1,smoothstep(0.0,0.33,x));
  c=mix(c,c2,smoothstep(0.33,0.66,x));
  c=mix(c,c3,smoothstep(0.66,1.0,x));
  return c; }
// палитра огня: чёрный → тёмно-красный → оранж → жёлтый → бело-горячий
vec3 firePal(float t){ t=clamp(t,0.,1.); vec3 c=vec3(0.0);
  c=mix(c,vec3(0.52,0.03,0.0),smoothstep(0.04,0.28,t)); c=mix(c,vec3(0.96,0.26,0.02),smoothstep(0.28,0.5,t));
  c=mix(c,vec3(1.0,0.62,0.06),smoothstep(0.5,0.72,t));  c=mix(c,vec3(1.0,0.9,0.42),smoothstep(0.72,0.9,t));
  c=mix(c,vec3(1.0,1.0,0.92),smoothstep(0.9,1.0,t)); return c; }
// ramp призмы: индиго → фиолет → маджента → коралл → оранж → золото
vec3 prismRamp(float x){ x=clamp(x,0.,1.);
  vec3 c=vec3(0.03,0.02,0.12);
  c=mix(c,vec3(0.16,0.20,0.78),smoothstep(0.00,0.20,x)); c=mix(c,vec3(0.48,0.26,0.90),smoothstep(0.20,0.38,x));
  c=mix(c,vec3(0.85,0.28,0.68),smoothstep(0.38,0.55,x)); c=mix(c,vec3(0.95,0.38,0.36),smoothstep(0.55,0.70,x));
  c=mix(c,vec3(0.98,0.60,0.20),smoothstep(0.70,0.85,x)); c=mix(c,vec3(1.00,0.85,0.48),smoothstep(0.85,1.00,x));
  return c*c; }

void main(){
  vec2 uv=gl_FragCoord.xy/u_res;
  vec2 p=uv-0.5; p.x*=u_res.x/u_res.y;
  float t=u_time;
  vec3 col;

  if(u_mode==0){                         // ВОДА: бирюзовый градиент + каустика
    col=mix(u_c1,u_c2, smoothstep(0.0,1.0,uv.y));
    float c=clamp(caustic(uv*3.2+vec2(t*0.03,0.0),t*0.35),0.,3.);
    col=mix(col,vec3(1.0),smoothstep(0.9,1.9,c)*0.35);
  } else if(u_mode==1){                  // ОБЛАКА: мягкий белый на голубом, плывут
    col=mix(u_c1,u_c2, smoothstep(0.0,1.0,uv.y));
    vec2 q=uv*2.2+vec2(t*0.06, t*0.015);
    q+=0.32*vec2(fbm(q*1.6+11.+t*0.05),fbm(q*1.6+41.-t*0.04));   // облака ещё и морфятся
    float d=fbm(q*1.9);
    col=mix(col,vec3(1.0), smoothstep(0.55,0.8,d)*0.9);
    col=mix(col,vec3(0.92,0.95,1.0), smoothstep(0.44,0.66,d)*0.4);
  } else if(u_mode==2){                  // ТРАВА: зелёный + ветровые волны
    col=mix(u_c1,u_c2, smoothstep(0.0,1.0,uv.y));
    float streak=fbm(vec2(uv.x*7.0, uv.y*2.2) + vec2(sin(uv.y*8.0+t*1.1)*0.18, t*0.12));
    col*=0.82+0.30*streak;
    col+=vec3(0.05,0.09,0.02)*smoothstep(0.4,1.0,streak);
  } else if(u_mode==3){                  // WALLET: сочный mesh + явное «денежное течение»
    // спокойный жидкий денежный градиент: текущее закрученное поле → зелёно-золотая палитра
    vec2 pp=uv; pp.x*=u_res.x/u_res.y;
    float tt=t*0.18;                                               // медленнее
    vec2 q=pp*1.9;
    q += 1.0*vec2(fbm(q+vec2(tt,1.0)), fbm(q+vec2(4.0,-tt*0.8)));   // закрученный поток
    float n=fbm(q*0.9+vec2(tt*0.6,0.0));
    n=(n-0.5)*1.9+0.5;                                             // разлёт по палитре
    col=wpal(n);
  } else if(u_mode==4){                  // HEATMAP: крупные мягкие термо-ленты (живописно)
    vec2 fp=uv; fp.x*=u_res.x/u_res.y;
    float tt=t*0.20;
    vec2 q=fp*1.25;
    q += 0.85*vec2(bands(q*0.7+vec2(0.0,tt*0.5)), bands(q*0.7+vec2(5.2,-tt*0.45)));
    float base=bands(q*0.85+vec2(tt*0.3,0.0));
    base=clamp((base-0.52)*1.7+0.5, 0.0, 1.0);
    col=pal(base);
  } else if(u_mode==6){                  // PRISM: ромбик, тепловой контур, бегущий свет с хвостом
    vec2 rp = mat2(0.70710678,-0.70710678,0.70710678,0.70710678)*p;
    vec2 qq = abs(rp) - 0.21 + 0.065;
    float d = length(max(qq,0.)) + min(max(qq.x,qq.y),0.) - 0.065;
    float phi = atan(p.y,p.x);
    float s6 = mod(phi + t*0.85, 6.28318);
    float behind = min(s6, 6.28318 - s6);
    float run = exp(-behind*behind*7.0);
    float tail = exp(-s6*1.25) * smoothstep(0.0,0.30,s6);
    float contour = exp(-abs(d)*20.0);
    float heat = contour*(0.32 + 0.95*run)
               + smoothstep(0.008,-0.02,d)*(0.34 - clamp(-d*3.5,0.,1.)*0.24);
    vec3 cl = prismRamp(clamp(heat,0.,1.));
    cl += vec3(1.05,0.80,0.45)*(0.5+0.5*run)*tail*contour*0.9;   // дисперсионный хвост (упрощённо)
    col = sqrt(max(cl, vec3(0.0)));                              // linear → display
  } else {                               // LAVA: восковые метаболы + мелкие капли на чёрном
    float asp=u_res.x/u_res.y; vec2 pl=vec2(uv.x*asp, uv.y);
    float tt=t*0.28;
    vec2 wl = pl + 0.085*vec2(noise(pl*3.0+vec2(tt*0.25,1.0))-0.5, noise(pl*3.0+vec2(9.0,-tt*0.25))-0.5);
    float F=0.0;
    for(int i=0;i<6;i++){ float fi=float(i);
      float bx=(0.5+(fi/5.0-0.5)*0.60)*asp + 0.05*asp*sin(tt*0.5+fi*1.3);
      float by=0.5+0.42*sin(tt*(0.28+0.05*fi)+fi*1.7);
      float rr=0.085+0.03*sin(tt*0.4+fi*2.0);
      float st=0.52+0.30*sin(tt*0.5+fi*1.5); float sh=0.22*sin(tt*0.35+fi);
      vec2 dv=wl-vec2(bx,by); dv.x+=dv.y*sh; dv.y*=st; F+=rr*rr/(dot(dv,dv)+0.0008); }
    for(int i=0;i<12;i++){ float fi=float(i);
      float sx=hash1(fi*1.7+0.3)*asp;
      float spd=0.06+hash1(fi*3.3)*0.14;
      float y=-0.06+fract(hash1(fi*5.1)+tt*spd)*1.12;
      float wob=0.035*sin(tt*(0.6+hash1(fi*2.2)*0.8)+fi);
      float rr=0.016+hash1(fi*4.4)*0.030;
      vec2 dv=wl-vec2(sx+wob*asp, y); dv.y*=0.78; F+=rr*rr/(dot(dv,dv)+0.0004); }
    F += smoothstep(0.15,0.0,uv.y)*1.2;
    vec3 bg=vec3(0.015,0.004,0.008);
    float m=smoothstep(2.0,2.8,F);
    vec3 lava=mix(vec3(0.62,0.03,0.02), vec3(1.0,0.35,0.02), smoothstep(2.1,3.2,F));
    lava=mix(lava, vec3(1.0,0.74,0.16), smoothstep(3.2,4.6,F));
    lava=mix(lava, vec3(1.0,0.95,0.72), smoothstep(4.6,6.5,F));
    col=bg + smoothstep(1.1,2.2,F)*0.26*vec3(1.0,0.25,0.05);
    col=mix(col,lava,m);
  }

  // светящийся центр + мягкое затемнение к краям (Apple-orb, усиливает inner shadow)
  float r=length(p);
  col*=1.0 - smoothstep(0.28,0.95,r)*0.5;
  col+=(1.0-smoothstep(0.0,0.62,r))*0.09;

  // мягкий дизер
  col+=(hash(gl_FragCoord.xy)-0.5)/255.;
  fragColor=vec4(col,1.0);
}`;

const VERT=`#version 300 es
in vec2 a; void main(){ gl_Position=vec4(a,0.,1.); }`;

const PALETTE = {
  0:[[0.055,0.353,0.463],[0.435,0.816,0.902]],   // вода: глубокая бирюза → светлая
  1:[[0.360,0.560,0.850],[0.900,0.945,1.000]],   // облака: голубой → белый
  2:[[0.120,0.360,0.150],[0.560,0.820,0.360]],   // трава: тёмно-зелёный → салат
  3:[[0.160,0.420,0.980],[1.000,0.780,0.300]],   // wallet: свои цвета в шейдере (эти не используются)
  4:[[0.050,0.030,0.180],[1.000,0.500,0.140]],   // heatmap: своя палитра в шейдере (эти не используются)
  5:[[0.030,0.010,0.000],[1.000,0.620,0.060]],   // fire: своя палитра в шейдере (эти не используются)
  6:[[0.030,0.020,0.120],[1.000,0.850,0.480]],   // prism: своя палитра в шейдере (эти не используются)
};

const errEl=document.getElementById('err');
function mkShader(canvas, mode){
  const gl=canvas.getContext('webgl2',{antialias:false,alpha:false});
  if(!gl){ errEl.style.display='block'; errEl.textContent='WebGL2 не поддерживается этим браузером.'; return null; }
  const vs=gl.createShader(gl.VERTEX_SHADER); gl.shaderSource(vs,VERT); gl.compileShader(vs);
  const fs=gl.createShader(gl.FRAGMENT_SHADER); gl.shaderSource(fs,FRAG); gl.compileShader(fs);
  if(!gl.getShaderParameter(fs,gl.COMPILE_STATUS)){ errEl.style.display='block'; errEl.textContent='GLSL: '+gl.getShaderInfoLog(fs); return null; }
  const pr=gl.createProgram(); gl.attachShader(pr,vs); gl.attachShader(pr,fs); gl.bindAttribLocation(pr,0,'a'); gl.linkProgram(pr); gl.useProgram(pr);
  const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
  const L=(n)=>gl.getUniformLocation(pr,n);
  const pal=PALETTE[mode];
  gl.uniform1i(L('u_mode'),mode);
  gl.uniform3f(L('u_c1'),pal[0][0],pal[0][1],pal[0][2]);
  gl.uniform3f(L('u_c2'),pal[1][0],pal[1][1],pal[1][2]);
  const uRes=L('u_res'), uTime=L('u_time');
  function size(){ const dpr=Math.min(devicePixelRatio||1,2);
    const w=Math.max(1,Math.round(canvas.clientWidth*dpr)), h=Math.max(1,Math.round(canvas.clientHeight*dpr));
    if(canvas.width!==w||canvas.height!==h){ canvas.width=w; canvas.height=h; gl.viewport(0,0,w,h); } }
  new ResizeObserver(size).observe(canvas); size();
  return { gl, size,
    setMode(m){ const pl=PALETTE[m]||PALETTE[0]; gl.uniform1i(L('u_mode'),m);
      gl.uniform3f(L('u_c1'),pl[0][0],pl[0][1],pl[0][2]); gl.uniform3f(L('u_c2'),pl[1][0],pl[1][1],pl[1][2]); },
    draw(t){ size(); gl.uniform2f(uRes,canvas.width,canvas.height); gl.uniform1f(uTime,t); gl.drawArrays(gl.TRIANGLES,0,3); } };
}

/* Стихии: тексты «You do / It answers» — из README */
const ELS=[
  {m:0, name:'Water',  href:'./card-water.html', verb:'touch', does:'Touch the pool surface', answers:'Ripples spread by a wave-equation sim, light catches the caustics.'},
  {m:6, name:'Prism',  href:'./prism.html',      verb:'tap',   does:'Tap the glass', answers:'White light runs the rim, splits into a spectrum, and the shape rings.'},
  {m:1, name:'Sky',    href:'./clouds.html',     verb:'blow',  does:'Blow the wind', answers:'Cumulus clouds drift and morph along the gust.'},
  {m:2, name:'Grass',  href:'./grass-3d.html',   verb:'walk',  does:'Walk through the field', answers:'Blades bend under the step and spring back.'},
  {m:3, name:'Wallet', href:'./motherlode.html', verb:'tap',   does:'Tap to receive money', answers:'The sum is random, the gradient warms toward gold as you get richer.'},
  {m:4, name:'Warm',   href:'./heatmap.html',    verb:'move',  does:'Move across the surface', answers:'Heat blooms behind the pointer and fades by diffusion.'},
  {m:5, name:'Lava',   href:'./lavalamp.html',   verb:'touch', does:'Touch to heat, tap to release a bubble', answers:'Molten blobs rise, split and merge.'},
];
const $=(s)=>document.querySelector(s);
const pad=(i)=>String(i+1).padStart(2,'0');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

$('#list').innerHTML=ELS.map((e,i)=>`<li><a class="row" href="${e.href}" aria-describedby="d${i}"><span class="n">${pad(i)}</span><span class="nm">${e.name}</span><span class="vb">${e.verb}</span></a><span id="d${i}" hidden>${e.does}. ${e.answers}</span></li>`).join('');

/* reduce: статичный кадр, перерисовка только при смене стихии и ресайзе */
const stage=mkShader($('#stage'),0);
let dirty=true;
function loop(now){
  if(stage && !document.hidden && (!reduce || dirty)){ stage.draw(reduce?6.0:now/1000); dirty=false; }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
addEventListener('resize',()=>{ dirty=true; });

/* Наведение/фокус на строку — стихия на сцене. Строка подсвечивается сразу, сцена меняется
   не чаще раза в 180 мс: при быстром проходе курсором светлые и тёмные стихии не вспыхивают.
   Тач: первый тап показывает стихию, второй открывает. */
const rows=[...document.querySelectorAll('.row')]; let ai=-1, shown=-1, lastSwap=0, swapT=0, lastPT='mouse';
function showStage(i){
  if(i===shown) return; shown=i; lastSwap=performance.now();
  stage&&stage.setMode(ELS[i].m); dirty=true;
  $('#does').textContent=ELS[i].does; $('#ans').textContent=ELS[i].answers;
}
function setA(i){
  if(i===ai) return; ai=i;
  rows.forEach((r,k)=>r.classList.toggle('on',k===i));
  clearTimeout(swapT);
  swapT=setTimeout(()=>showStage(ai), Math.max(0, 180-(performance.now()-lastSwap)));
}
rows.forEach((r,i)=>{
  r.addEventListener('pointerenter',e=>{ if(e.pointerType!=='touch') setA(i); });
  r.addEventListener('pointerdown',e=>{ lastPT=e.pointerType; });
  r.addEventListener('focus',()=>setA(i));
  r.addEventListener('click',e=>{ if(lastPT==='touch' && i!==ai){ e.preventDefault(); setA(i); } });
});

/* вернуть на ту стихию, с которой ушли (после «back») */
let start=0;
try{ const li=+sessionStorage.getItem('eab_lastCard'); if(ELS[li]) start=li; }catch(_){}
setA(start); showStage(start);
if(start) rows[start].scrollIntoView({block:'center'});

/* узкий экран: активна строка сразу под сценой */
const narrow=matchMedia('(max-width:760px)');
addEventListener('scroll',()=>{
  if(!narrow.matches) return;
  const line=$('.stage').getBoundingClientRect().bottom+48;
  let best=0, bd=Infinity;
  rows.forEach((r,i)=>{ const b=r.getBoundingClientRect(), d=Math.abs((b.top+b.bottom)/2-line); if(d<bd){ bd=d; best=i; } });
  setA(best);
},{passive:true});

/* переход на стихию: короткий fade-out, стихия делает fade-in на загрузке */
document.addEventListener('click',e=>{
  const a=e.target.closest('a.row');
  if(!a || e.defaultPrevented || e.metaKey || e.ctrlKey || e.shiftKey) return;
  e.preventDefault();
  try{ sessionStorage.setItem('eab_lastCard', rows.indexOf(a)); }catch(_){}
  if(reduce){ location.href=a.href; return; }
  document.body.classList.add('leaving');
  setTimeout(()=>{ location.href=a.href; },175);
});
addEventListener('pageshow',()=>document.body.classList.remove('leaving'));
</script>
</body>
</html>
